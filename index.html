<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科创项目小助手</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background:#f4f7fb; margin:0; padding:20px; color:#333; }
  h1 { color:#2a6df4; text-align:center; }
  h2 { color:#2a6df4; }
  h3 { margin-top:20px; border-left:4px solid #2a6df4; padding-left:8px; }
  .card { background:#fff; border-radius:10px; padding:12px; margin:10px 0; box-shadow:0 1px 4px rgba(0,0,0,.1); }
  .box { background:#fff; border-radius:10px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.1); }
  input, select, textarea, button { font-size:14px; padding:8px; margin:4px 2px; border-radius:6px; border:1px solid #ccc; }
  textarea { width:95%; min-height:60px; }
  button { background:#2a6df4; color:#fff; border:none; cursor:pointer; }
  button:hover { background:#1b4fc0; }
  .tag { background:#e6f0ff; color:#2a6df4; border-radius:6px; padding:2px 8px; font-size:12px; }
  .bar { background:#e6e6e6; border-radius:6px; height:12px; margin:8px 0; }
  .fill { background:#4caf50; height:12px; border-radius:6px; }
  .stage { display:block; padding:6px; margin:4px 0; background:#f0f4fa; border-radius:6px; cursor:pointer; }
  .stage.done { background:#dff5e1; text-decoration:line-through; color:#4caf50; }
  .rec, .rev { background:#f7f9fc; border-radius:6px; padding:8px; margin:6px 0; }
  .rec img { max-width:160px; display:block; margin-top:6px; border-radius:6px; }
  .rec small { color:#999; }
  .ab { display:inline-block; margin-right:10px; }
  .ab input { width:55px; }
  #detail { margin-top:20px; }
</style>
</head>
<body>

<h1>科创项目小助手</h1>

<!-- 新建项目 -->
<div class="box">
  <h3>新建项目</h3>
  <input id="pname" placeholder="项目名字，比如：自动浇花装置">
  <select id="ptheme">
    <option>未来工厂</option>
    <option>智慧城市</option>
    <option>生命盒子</option>
    <option>自然公社</option>
    <option>太空码头</option>
  </select>
  <input id="pmembers" placeholder="小组成员，用逗号隔开">
  <button onclick="addProject()">创建项目</button>
</div>

<!-- 项目列表 / 进度看板 -->
<h3>我的项目（进度看板）</h3>
<div id="list"></div>

<!-- 项目详情 -->
<div id="detail"></div>

<script>
// ---------- 数据 ----------
var projects = JSON.parse(localStorage.getItem('ctProjects') || '[]');
var currentId = null;

var THEMES = ['未来工厂','智慧城市','生命盒子','自然公社','太空码头'];
var STAGES = ['提出问题','设计方案','记录数据','分析结论','成果展示'];
var ABILITIES = ['探究','协作','创新','表达'];

function save() {
  localStorage.setItem('ctProjects', JSON.stringify(projects));
}

function findProject(id) {
  for (var i = 0; i < projects.length; i++) {
    if (projects[i].id === id) return projects[i];
  }
  return null;
}

function escapeHtml(s) {
  return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- 画能力雷达图（用 SVG，不用装任何插件） ----------
function radarSVG(values, size) {
  var cx = size / 2, cy = size / 2, r = size / 2 - 28;
  var n = values.length;
  var s = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';

  // 一圈一圈的网格
  for (var level = 2; level <= 10; level += 2) {
    var pts = [];
    for (var i = 0; i < n; i++) {
      var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
      var rr = r * level / 10;
      pts.push((cx + rr * Math.cos(ang)).toFixed(1) + ',' + (cy + rr * Math.sin(ang)).toFixed(1));
    }
    s += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#dde6f5"/>';
  }
  // 从中心出去的轴线
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + r * Math.cos(ang)).toFixed(1) +
         '" y2="' + (cy + r * Math.sin(ang)).toFixed(1) + '" stroke="#dde6f5"/>';
  }
  // 数据围成的形状
  var dpts = [];
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    var v = Math.max(0, Math.min(10, Number(values[i]) || 0));
    var rr = r * v / 10;
    dpts.push((cx + rr * Math.cos(ang)).toFixed(1) + ',' + (cy + rr * Math.sin(ang)).toFixed(1));
  }
  s += '<polygon points="' + dpts.join(' ') + '" fill="rgba(42,109,244,0.25)" stroke="#2a6df4" stroke-width="2"/>';
  // 四个维度的名字
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    var lx = cx + (r + 15) * Math.cos(ang);
    var ly = cy + (r + 15) * Math.sin(ang);
    s += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) +
         '" font-size="12" fill="#333" text-anchor="middle" dominant-baseline="middle">' + ABILITIES[i] + '</text>';
  }
  s += '</svg>';
  return s;
}

// ---------- 新建项目 ----------
function addProject() {
  var name = document.getElementById('pname').value.trim();
  var theme = document.getElementById('ptheme').value;
  var members = document.getElementById('pmembers').value.trim();
  if (!name) { alert('请先写项目名字'); return; }

  var stageList = [];
  for (var i = 0; i < STAGES.length; i++) {
    stageList.push({ name: STAGES[i], done: false });
  }

  projects.push({
    id: Date.now(),
    name: name,
    theme: theme,
    members: members ? members.split(/[,，、\s]+/) : [],
    stages: stageList,
    records: [],
    reviews: [],
    mentor: '',
    ability: [4, 4, 4, 4]
  });

  document.getElementById('pname').value = '';
  document.getElementById('pmembers').value = '';
  save();
  render();
}

// ---------- 显示项目列表 ----------
function render() {
  var list = document.getElementById('list');
  list.innerHTML = '';
  if (projects.length === 0) {
    list.innerHTML = '<p>还没有项目，先在上面新建一个吧。</p>';
    return;
  }
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    var done = 0;
    for (var j = 0; j < p.stages.length; j++) if (p.stages[j].done) done++;

    var div = document.createElement('div');
    div.className = 'card';
    div.innerHTML =
      '<b>' + escapeHtml(p.name) + '</b> <span class="tag">' + p.theme + '</span>' +
      '<div class="bar"><div class="fill" style="width:' + (done / STAGES.length * 100) + '%"></div></div>' +
      '<small>进度 ' + done + '/' + STAGES.length + '</small><br>' +
      '<button onclick="openProject(' + p.id + ')">打开</button>' +
      '<button onclick="delProject(' + p.id + ')">删除</button>';
    list.appendChild(div);
  }
}

// ---------- 打开项目详情 ----------
function openProject(id) {
  currentId = id;
  renderDetail();
  document.getElementById('detail').scrollIntoView();
}

function delProject(id) {
  if (!confirm('确定要删除这个项目吗？')) return;
  var newList = [];
  for (var i = 0; i < projects.length; i++) {
    if (projects[i].id !== id) newList.push(projects[i]);
  }
  projects = newList;
  if (currentId === id) currentId = null;
  save();
  render();
  renderDetail();
}

function renderDetail() {
  var box = document.getElementById('detail');
  var p = findProject(currentId);
  if (!p) { box.innerHTML = ''; return; }

  var html = '<div class="box">';
  html += '<h2>' + escapeHtml(p.name) + '</h2>';
  html += '<p>主题：' + p.theme + '　成员：' + (p.members.join('、') || '（未填写）') + '</p>';

  // 1. 项目阶段流程
  html += '<h3>项目进度</h3>';
  for (var i = 0; i < p.stages.length; i++) {
    var s = p.stages[i];
    html += '<label class="stage ' + (s.done ? 'done' : '') + '">' +
            '<input type="checkbox" ' + (s.done ? 'checked' : '') +
            ' onchange="toggleStage(' + p.id + ',' + i + ')"> ' +
            (i + 1) + '. ' + s.name + '</label>';
  }

  // 2. 过程记录
  html += '<h3>过程记录</h3>';
  html += '<textarea id="recText" placeholder="写点什么，比如今天做了什么、发现了什么"></textarea><br>';
  html += '<input type="file" id="recFile" accept="image/*">';
  html += '<button onclick="addRecord(' + p.id + ')">添加记录</button>';
  for (var k = 0; k < p.records.length; k++) {
    var r = p.records[k];
    html += '<div class="rec"><small>' + r.time + '</small><div>' + escapeHtml(r.text) + '</div>';
    if (r.img) html += '<img src="' + r.img + '">';
    html += '</div>';
  }

  // 3. 同伴互评
  html += '<h3>同伴互评</h3>';
  html += '<input id="revFrom" placeholder="你的名字">';
  html += '<select id="revScore">';
  for (var n = 1; n <= 5; n++) html += '<option value="' + n + '">' + n + ' 星</option>';
  html += '</select>';
  html += '<input id="revComment" placeholder="写一句评语">';
  html += '<button onclick="addReview(' + p.id + ')">提交互评</button>';
  for (var m = 0; m < p.reviews.length; m++) {
    var rv = p.reviews[m];
    html += '<div class="rev">' + escapeHtml(rv.from || '匿名') + '：' +
            '★'.repeat(rv.score) + ' ' + escapeHtml(rv.comment) + '</div>';
  }

  // 4. 导师点评
  html += '<h3>导师点评</h3>';
  html += '<textarea id="mentorText" placeholder="老师的点评">' + escapeHtml(p.mentor || '') + '</textarea><br>';
  html += '<button onclick="saveMentor(' + p.id + ')">保存点评</button>';

  // 5. 能力雷达
  html += '<h3>能力雷达</h3>';
  html += radarSVG(p.ability, 220);
  html += '<div style="margin-top:8px">';
  for (var a = 0; a < ABILITIES.length; a++) {
    html += '<span class="ab">' + ABILITIES[a] +
            ' <input id="ab' + a + '" type="number" min="0" max="10" value="' + p.ability[a] + '"></span>';
  }
  html += '</div>';
  html += '<button onclick="saveAbility(' + p.id + ')">保存分数</button>';
  html += '<button onclick="autoAbility(' + p.id + ')">按进度自动填</button>';

  // 6. 项目档案 + 家长查看
  html += '<h3>项目档案</h3>';
  html += '<button onclick="exportArchive(' + p.id + ')">导出档案</button>';
  html += ' <button onclick="openParent(' + p.id + ')">家长查看页</button>';
  html += ' <button onclick="closeDetail()">关闭</button>';

  html += '</div>';
  box.innerHTML = html;
}

function closeDetail() {
  currentId = null;
  renderDetail();
}

// ---------- 各个操作 ----------
function toggleStage(id, index) {
  var p = findProject(id);
  p.stages[index].done = !p.stages[index].done;
  save();
  render();
  renderDetail();
}

function addRecord(id) {
  var p = findProject(id);
  var text = document.getElementById('recText').value.trim();
  var file = document.getElementById('recFile').files[0];
  if (!text && !file) { alert('写点内容或选张图片吧'); return; }

  var now = new Date().toLocaleString();
  if (file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      p.records.push({ time: now, text: text, img: e.target.result });
      save();
      renderDetail();
    };
    reader.readAsDataURL(file);
  } else {
    p.records.push({ time: now, text: text, img: '' });
    save();
    renderDetail();
  }
}

function addReview(id) {
  var p = findProject(id);
  var from = document.getElementById('revFrom').value.trim();
  var score = Number(document.getElementById('revScore').value);
  var comment = document.getElementById('revComment').value.trim();
  p.reviews.push({ from: from, score: score, comment: comment });
  save();
  renderDetail();
}

function saveMentor(id) {
  var p = findProject(id);
  p.mentor = document.getElementById('mentorText').value;
  save();
  alert('点评已保存');
}

// 保存四个能力分数
function saveAbility(id) {
  var p = findProject(id);
  for (var a = 0; a < ABILITIES.length; a++) {
    p.ability[a] = Number(document.getElementById('ab' + a).value) || 0;
  }
  save();
  renderDetail();
}

// 根据项目情况自动给分（供参考，可以再手动改）
function autoAbility(id) {
  var p = findProject(id);
  var done = 0, withImg = 0;
  for (var i = 0; i < p.stages.length; i++) if (p.stages[i].done) done++;
  for (var k = 0; k < p.records.length; k++) if (p.records[k].img) withImg++;

  p.ability[0] = Math.min(10, Math.round(done / p.stages.length * 6) + Math.min(p.records.length, 4));
  p.ability[1] = Math.min(10, p.reviews.length + p.members.length);
  p.ability[2] = Math.min(10, 2 + withImg);
  p.ability[3] = p.stages[p.stages.length - 1].done ? 8 : 4;

  save();
  renderDetail();
}

// ---------- 家长查看页（只读，新窗口打开） ----------
function openParent(id) {
  var p = findProject(id);
  var done = 0;
  for (var i = 0; i < p.stages.length; i++) if (p.stages[i].done) done++;

  var h = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">';
  h += '<title>家长查看 - ' + p.name + '</title>';
  h += '<style>body{font-family:"Microsoft YaHei",sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#333}';
  h += 'h1{color:#2a6df4}h2{border-left:4px solid #2a6df4;padding-left:8px}';
  h += '.item{background:#f7f9fc;border-radius:6px;padding:8px;margin:6px 0}small{color:#999}</style></head><body>';
  h += '<h1>' + escapeHtml(p.name) + ' · 成长档案</h1>';
  h += '<p>主题：' + p.theme + '　成员：' + (p.members.join('、') || '（未填写）') + '</p>';
  h += '<p>项目进度：' + done + '/' + p.stages.length + '</p>';

  h += '<h2>能力雷达</h2>' + radarSVG(p.ability, 240);

  h += '<h2>过程记录（' + p.records.length + ' 条）</h2>';
  if (p.records.length === 0) h += '<p>（还没有记录）</p>';
  for (var k = 0; k < p.records.length; k++) {
    h += '<div class="item"><small>' + p.records[k].time + '</small><div>' +
         escapeHtml(p.records[k].text) + '</div></div>';
  }

  h += '<h2>同伴互评</h2>';
  if (p.reviews.length === 0) h += '<p>（还没有互评）</p>';
  for (var m = 0; m < p.reviews.length; m++) {
    h += '<div class="item">' + escapeHtml(p.reviews[m].from || '匿名') + '：' +
         '★'.repeat(p.reviews[m].score) + ' ' + escapeHtml(p.reviews[m].comment) + '</div>';
  }

  h += '<h2>导师点评</h2><p>' + (p.mentor ? escapeHtml(p.mentor) : '（暂无）') + '</p>';
  h += '</body></html>';

  var w = window.open('', '_blank');
  w.document.write(h);
  w.document.close();
}

// ---------- 导出项目档案 ----------
function exportArchive(id) {
  var p = findProject(id);
  var t = '【项目档案】\n';
  t += '项目名称：' + p.name + '\n';
  t += '主题：' + p.theme + '\n';
  t += '成员：' + (p.members.join('、') || '（未填写）') + '\n\n';

  t += '【阶段进度】\n';
  for (var i = 0; i < p.stages.length; i++) {
    t += (i + 1) + '. ' + p.stages[i].name + (p.stages[i].done ? ' 已完成' : ' 未完成') + '\n';
  }

  t += '\n【能力评分】\n';
  for (var a = 0; a < ABILITIES.length; a++) {
    t += ABILITIES[a] + '：' + p.ability[a] + '/10\n';
  }

  t += '\n【过程记录】\n';
  for (var k = 0; k < p.records.length; k++) {
    t += (k + 1) + '. [' + p.records[k].time + '] ' + p.records[k].text +
         (p.records[k].img ? '（含图片）' : '') + '\n';
  }

  t += '\n【同伴互评】\n';
  for (var m = 0; m < p.reviews.length; m++) {
    t += (p.reviews[m].from || '匿名') + '：' + '★'.repeat(p.reviews[m].score) +
         ' ' + p.reviews[m].comment + '\n';
  }

  t += '\n【导师点评】\n' + (p.mentor || '（暂无）') + '\n';

  var blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
  var a2 = document.createElement('a');
  a2.href = URL.createObjectURL(blob);
  a2.download = p.name + '_项目档案.txt';
  a2.click();
}

// 页面打开时先显示已有项目
render();
</script>
</body>
</html>
