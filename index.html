<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星迹——青少年科创项目协作与同伴互评平台</title>
<style>
  :root {
    --bg:#eef2fb;
    --card:#ffffff;
    --primary:#3b5bdb;
    --primary2:#7048e8;
    --green:#37b24d;
    --text:#1c2333;
    --muted:#7a8699;
    --line:#e6ebf5;
    --shadow:0 2px 8px rgba(30,50,100,.08);
  }
  * { box-sizing:border-box; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg); margin:0; padding:20px; color:var(--text); line-height:1.6;
  }
  .wrap { max-width:960px; margin:0 auto; }

  /* ---------- 顶部 ---------- */
  .hero {
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff; border-radius:16px; padding:28px 24px;
    box-shadow:0 8px 24px rgba(59,91,219,.35); position:relative; overflow:hidden;
  }
  .hero h1 { margin:0; font-size:26px; }
  .hero p { margin:6px 0 0; opacity:.85; font-size:14px; }
  .stats { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; }
  .stat {
    background:rgba(255,255,255,.15); border-radius:12px; padding:10px 16px; min-width:110px;
    backdrop-filter:blur(4px);
  }
  .stat b { font-size:22px; display:block; }
  .stat span { font-size:12px; opacity:.85; }

  /* ---------- 卡片 ---------- */
  .card, .box {
    background:var(--card); border-radius:14px; padding:16px;
    box-shadow:var(--shadow); margin:14px 0; border:1px solid var(--line);
  }
  h3 { margin:0 0 10px; font-size:16px; display:flex; align-items:center; gap:8px; }
  h3::before { content:""; width:4px; height:16px; border-radius:2px; background:linear-gradient(var(--primary),var(--primary2)); }

  input, select, textarea, button { font-size:14px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,91,219,.12); }
  textarea { width:100%; min-height:64px; resize:vertical; }
  button { cursor:pointer; border:none; font-weight:600; transition:.2s; }
  button:hover { transform:translateY(-1px); }
  .btn-p { background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff; }
  .btn-p:hover { box-shadow:0 4px 12px rgba(59,91,219,.35); }
  .btn-g { background:#f0f3fa; color:var(--text); }
  .btn-g:hover { background:#e4e9f5; }
  .btn-danger { background:#fff0f0; color:#e03131; }
  .btn-danger:hover { background:#ffe3e3; }
  .tag {
    background:#eef3ff; color:var(--primary); border-radius:20px; padding:3px 12px; font-size:12px;
    display:inline-block;
  }

  /* ---------- 顶部工具栏 ---------- */
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .toolbar input[type=text] { flex:1; min-width:160px; }
  select { background:#fff; }

  /* ---------- 项目卡片列表 ---------- */
  #list { display:grid; grid-template-columns:1fr; gap:12px; }
  .proj {
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;
    box-shadow:var(--shadow); transition:.2s; cursor:pointer;
  }
  .proj:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(30,50,100,.12); }
  .proj .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
  .proj .name { font-size:17px; font-weight:700; }
  .proj .meta { font-size:12px; color:var(--muted); margin:4px 0 8px; }
  .pbar { background:#ecf0f9; border-radius:8px; height:10px; overflow:hidden; }
  .pfill {
    height:100%; border-radius:8px;
    background:linear-gradient(90deg,var(--primary),var(--primary2));
    transition:width .5s ease; display:block;
  }
  .proj .pct { font-size:12px; color:var(--muted); margin-top:4px; }
  .empty {
    text-align:center; color:var(--muted); padding:36px 0; font-size:14px;
    background:var(--card); border-radius:14px; border:1px dashed var(--line);
  }

  /* ---------- 详情 ---------- */
  #detail .box { animation:fadeIn .3s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .stage {
    display:flex; align-items:center; gap:8px; padding:8px 12px; margin:4px 0;
    background:#f4f7fd; border-radius:10px; cursor:pointer; transition:.2s;
  }
  .stage:hover { background:#eaf0fc; }
  .stage.done { background:#e9f9ed; color:#2b8a3e; }
  .stage.done .sname { text-decoration:line-through; }
  .sno {
    background:var(--primary); color:#fff; border-radius:50%; width:20px; height:20px;
    font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .stage.done .sno { background:var(--green); }

  /* 记录时间线 */
  .timeline { border-left:2px solid var(--line); margin-left:8px; padding-left:16px; }
  .rec { position:relative; margin:10px 0; }
  .rec::before {
    content:""; position:absolute; left:-23px; top:8px; width:10px; height:10px;
    border-radius:50%; background:var(--primary2); border:2px solid #fff;
    box-shadow:0 0 0 2px var(--primary2);
  }
  .rec .time { font-size:12px; color:var(--muted); }
  .rec .txt { background:#f7f9fd; border-radius:10px; padding:8px 10px; margin-top:4px; }
  .rec img { max-width:180px; display:block; margin-top:8px; border-radius:10px; }
  .rec .del { float:right; font-size:12px; padding:2px 8px; }

  /* 互评 */
  .rev {
    display:flex; align-items:center; gap:10px; background:#f7f9fd; border-radius:10px;
    padding:8px 10px; margin:6px 0;
  }
  .rev .stars { color:#fab005; letter-spacing:2px; }
  .rev .from { font-weight:700; font-size:13px; }
  .rev .cmt { color:var(--muted); font-size:13px; flex:1; }
  .avg { font-size:13px; color:var(--muted); }

  /* 能力雷达 */
  .ab {
    display:inline-flex; flex-direction:column; align-items:center; gap:2px;
    margin:6px 12px 6px 0; background:#f4f7fd; border-radius:10px; padding:8px 12px;
  }
  .ab .abName { font-size:13px; font-weight:700; color:var(--primary); }
  .ab input[type=range] { accent-color:var(--primary); }
  .ab b { font-size:16px; }

  /* 弹窗 */
  .mask {
    position:fixed; inset:0; background:rgba(20,30,60,.45); display:none;
    align-items:center; justify-content:center; z-index:99; backdrop-filter:blur(2px);
  }
  .mask.show { display:flex; }
  .modal {
    background:#fff; border-radius:16px; padding:22px; width:90%; max-width:400px;
    box-shadow:0 16px 40px rgba(20,30,60,.3); animation:pop .25s ease;
  }
  @keyframes pop { from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;} }
  .modal h4 { margin:0 0 12px; }
  .modal .tips { font-size:12px; color:var(--muted); margin-top:6px; }
  .modal input[type=text], .modal input[type=password] { width:92%; display:block; margin:6px 0; }
  .modal .tips a { color:var(--primary); text-decoration:none; }

  /* 右上角用户区 */
  .ubox { position:absolute; top:16px; right:20px; display:flex; gap:8px; align-items:center; }
  .ubox button {
    background:rgba(255,255,255,.18); color:#fff; padding:6px 14px;
    border:1px solid rgba(255,255,255,.45); border-radius:20px; font-size:13px;
  }
  .ubox button:hover { background:rgba(255,255,255,.35); transform:none; }
  .ubox .uname { font-size:13px; color:#fff; opacity:.95; }

  /* AI 教练 */
  .ai-box { border:1px solid rgba(59,91,219,.25); background:linear-gradient(180deg,#f5f7ff,#fff); }
  .ai-box ul { margin:10px 0; padding:0; list-style:none; }
  .ai-box li { background:#fff; border:1px solid #e3e8f5; border-radius:10px; padding:10px 12px; margin:8px 0; font-size:14px; line-height:1.7; }
  .ai-box li b { color:var(--primary); }
  .badge {
    display:inline-block; background:var(--primary); color:#fff; font-size:11px;
    padding:2px 8px; border-radius:20px; vertical-align:2px; margin-left:4px;
  }

  /* AI 助教：悬浮聊天窗 */
  #aiFab {
    position:fixed; right:18px; bottom:18px; z-index:98;
    background:linear-gradient(135deg,#3b5bdb,#7048e8); color:#fff;
    border:none; width:56px; height:56px; border-radius:50%;
    font-size:24px; cursor:pointer; box-shadow:0 8px 20px rgba(59,91,219,.4);
    transition:transform .15s;
  }
  #aiFab:hover { transform:scale(1.08); }
  #aiPanel {
    position:fixed; right:18px; bottom:86px; z-index:97;
    width:340px; max-width:92vw; height:460px; max-height:70vh;
    background:#fff; border-radius:16px; box-shadow:0 16px 40px rgba(20,30,60,.3);
    display:none; flex-direction:column; overflow:hidden;
  }
  #aiPanel.show { display:flex; animation:pop .2s ease; }
  #aiHead {
    background:linear-gradient(135deg,#3b5bdb,#7048e8); color:#fff; padding:10px 14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  #aiHead h4 { margin:0; font-size:15px; }
  #aiHead small { opacity:.85; font-size:11px; }
  #aiHead button { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
  #aiMsgs { flex:1; overflow-y:auto; padding:12px; background:#f5f7ff; }
  .aiBub {
    max-width:85%; padding:9px 12px; border-radius:14px;
    font-size:13px; line-height:1.7; margin:6px 0;
    white-space:pre-wrap; word-break:break-word;
  }
  .aiBub.ai { background:#fff; border:1px solid #e3e8f5; border-top-left-radius:4px; }
  .aiBub.me { background:#3b5bdb; color:#fff; margin-left:auto; border-top-right-radius:4px; }
  .typing { color:#7a8699; font-size:12px; padding:4px 2px; }
  #aiChips { display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px 0; background:#f5f7ff; }
  #aiChips button {
    border:1px solid #c8d2f0; background:#fff; color:#3b5bdb; font-size:12px;
    padding:5px 10px; border-radius:20px; cursor:pointer;
  }
  #aiChips button:hover { background:#eef2ff; }
  #aiInputRow { display:flex; gap:8px; padding:10px; background:#fff; }
  #aiInputRow input {
    flex:1; border:1px solid #dbe2f5; border-radius:20px; padding:8px 14px;
    font-size:13px; outline:none;
  }
  #aiInputRow input:focus { border-color:#3b5bdb; }
  #aiSend { background:#3b5bdb; color:#fff; border:none; border-radius:20px; padding:8px 16px; cursor:pointer; font-size:13px; }
  #aiMsgs::-webkit-scrollbar { width:5px; }
  #aiMsgs::-webkit-scrollbar-thumb { background:#c8d2f0; border-radius:3px; }

  /* 老师端 */
  .teach-banner {
    background:#fff3bf; border:1px solid #ffd43b; color:#5c4d00;
    border-radius:12px; padding:10px 12px; margin-bottom:12px;
    font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .classrow {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:#f7f9fd; border:1px solid #e3e8f5; border-radius:10px;
    padding:8px 10px; margin:6px 0; font-size:13px;
  }
  .classrow .cwho { font-weight:bold; color:var(--primary); min-width:70px; }
  .classrow .cname { font-weight:bold; }
  .classrow .ctag { background:#eef2ff; color:#3b5bdb; border-radius:20px; padding:2px 8px; font-size:12px; }
  .classrow button { margin-left:auto; }

  /* 提示条 */
  #toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(80px);
    background:#1c2333; color:#fff; padding:10px 20px; border-radius:30px; font-size:14px;
    opacity:0; transition:.3s; z-index:99; box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部 -->
  <div class="hero">
    <h1>🚀 星迹</h1>
    <p>让每一次尝试都被看见 —— 青少年科创项目协作与同伴互评平台</p>
    <div class="stats" id="stats"></div>
    <div class="ubox" id="userbox"></div>
  </div>

  <!-- 新建项目 -->
  <div class="box" id="newBox">
    <h3>新建项目</h3>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      <input id="pname" placeholder="项目名字，比如：自动浇花装置">
      <select id="ptheme">
        <option>未来工厂</option>
        <option>智慧城市</option>
        <option>生命盒子</option>
        <option>自然公社</option>
        <option>太空码头</option>
      </select>
      <input id="pmembers" placeholder="小组成员，用逗号隔开">
      <button class="btn-p" onclick="addProject()">＋ 创建项目</button>
    </div>
  </div>

  <!-- 工具栏：搜索 / 筛选 / 排序 -->
  <div class="toolbar" id="toolbar">
    <input type="text" id="kw" placeholder="🔍 搜索项目名称或成员" oninput="renderList()">
    <select id="themeFilter" onchange="renderList()">
      <option value="全部">全部主题</option>
      <option>未来工厂</option>
      <option>智慧城市</option>
      <option>生命盒子</option>
      <option>自然公社</option>
      <option>太空码头</option>
    </select>
    <select id="sortBy" onchange="renderList()">
      <option value="progress">按进度排序</option>
      <option value="new">按新建时间排序</option>
      <option value="name">按名称排序</option>
    </select>
  </div>

  <!-- 项目列表 -->
  <div id="list" class="studonly"></div>

  <!-- 项目详情 -->
  <div id="detail"></div>
</div>

<!-- 通用弹窗（登录 / 注册 / 删除确认） -->
<div class="mask" id="mask" onclick="maskClick(event)">
  <div class="modal">
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

<!-- AI 助教：悬浮聊天窗 -->
<button id="aiFab" onclick="aiToggle()" title="问 AI 助教">🤖</button>
<div id="aiPanel">
  <div id="aiHead">
    <div><h4>🤖 AI 助教</h4><small>离线问答 · 演示版 · 不联网</small></div>
    <button onclick="aiToggle()">✕</button>
  </div>
  <div id="aiMsgs"></div>
  <div id="aiChips"></div>
  <div id="aiInputRow">
    <input id="aiInput" placeholder="问点什么…（回车发送）" onkeydown="if(event.key==='Enter')aiSend()">
    <button id="aiSend" onclick="aiSend()">发送</button>
  </div>
</div>

<script>
/* ============ 星迹 · 服务器同步桥 ============
   如果页面是从星迹服务器（http://服务器IP:8080）打开的，
   账号和项目数据会自动同步到服务器的 star-data.json；
   在 GitHub 演示页打开时，接口不存在，自动退回原来的本机存储，不影响演示。 */
(function () {
  'use strict';
  var TOKEN = 'xjstar2026';   // 演示用钥匙（写在页面里，正式版要换成真登录）
  var cache = {};
  var IS_SYNC = false;
  var WHY = '';
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/store?t=' + TOKEN, false);
    // 注意：同步请求不能设 timeout（浏览器会抛 InvalidAccessError），这里故意不设
    xhr.send();
    if (xhr.status === 200) {
      var got = JSON.parse(xhr.responseText);
      if (got && got.ok) { cache = got.store || {}; IS_SYNC = true; }
      else { WHY = '接口返回异常'; }
    } else { WHY = '接口状态 ' + xhr.status; }
  } catch (e) { WHY = e.name + ':' + e.message; IS_SYNC = false; }
  window.__xjCache = cache;
  window.__xjSync = IS_SYNC;
  window.__xjTok = TOKEN;

  if (IS_SYNC) {
    var _ls = window.localStorage;
    var realGet = _ls.getItem.bind(_ls), realSet = _ls.setItem.bind(_ls), realDel = _ls.removeItem.bind(_ls);
    function isSyncKey(k) { return k === 'ctProjects' || (typeof k === 'string' && k.indexOf('ct_') === 0); }
    var dirty = {}, timers = {};
    function push(k) {
      dirty[k] = cache[k];
      clearTimeout(timers[k]);
      timers[k] = setTimeout(flush, 400);
    }
    var pushed = 0;
    function flush() {
      var batch = {}, has = false;
      for (var k in dirty) if (dirty.hasOwnProperty(k)) { batch[k] = dirty[k]; has = true; }
      dirty = {};
      if (!has) return;
      var p = new XMLHttpRequest();
      p.open('POST', '/api/store', true);
      p.setRequestHeader('Content-Type', 'application/json');
      p.send(JSON.stringify({ t: TOKEN, batch: batch }));
      p.onreadystatechange = function () {
        if (p.readyState === 4 && p.status === 200 && window.__xjBadge) {
          pushed += Object.keys(batch).length;
          window.__xjBadge.textContent = '🟢 已连接服务器 · 已推送 ' + pushed + ' 条';
        }
      };
    }
    // 旧数据搬家：本机有、但服务器还没有的账号数据，自动补传上云一次（服务器已有的不动 → 以服务器为准）
    var localOnly = [];
    for (var li = 0; li < _ls.length; li++) {
      var lk = _ls.key(li);
      if (isSyncKey(lk) && cache[lk] === undefined) localOnly.push(lk);
    }
    for (var lj = 0; lj < localOnly.length; lj++) {
      var lv = realGet(localOnly[lj]);
      if (lv !== null) { cache[localOnly[lj]] = lv; dirty[localOnly[lj]] = lv; }
    }
    if (localOnly.length) flush();
    _ls.getItem = function (k) { if (isSyncKey(k) && cache[k] !== undefined) return cache[k]; return realGet(k); };
    _ls.setItem = function (k, v) {
      realSet(k, v);
      if (!isSyncKey(k)) return;
      cache[k] = String(v);
      push(k);
    };
    _ls.removeItem = function (k) {
      realDel(k);
      if (!isSyncKey(k)) return;
      delete cache[k];
      dirty[k] = null;   // null = 让服务器也删掉这个键
      clearTimeout(timers[k]);
      timers[k] = setTimeout(flush, 400);
    };
    window.addEventListener('beforeunload', function () { flush(); });
    // 页面左下角亮一盏小绿灯，表示已连上服务器（推送条数实时可见）
    window.addEventListener('DOMContentLoaded', function () {
      var b = document.createElement('div');
      b.textContent = '🟢 已连接服务器';
      b.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:999;background:#ebfbee;color:#2b8a3e;border:1px solid #69db7c;border-radius:20px;padding:3px 12px;font-size:12px;';
      document.body.appendChild(b);
      window.__xjBadge = b;
    });
  } else {
    // 没连上服务器（GitHub 演示页、或者接口没通）：挂一盏灰灯，让你一眼能看出来
    window.addEventListener('DOMContentLoaded', function () {
      var b = document.createElement('div');
      b.textContent = '⚪ 本机模式：' + (WHY || '未连上服务器');
      b.title = '没连上 /api/store' + (WHY ? '，原因：' + WHY : '');
      b.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:999;background:#f1f3f5;color:#868e96;border:1px solid #dee2e6;border-radius:20px;padding:3px 12px;font-size:12px;';
      document.body.appendChild(b);
      window.__xjBadge = null;
    });
  }
})();
</script>

<script>
// ---------- 数据 ----------
var currentUser = localStorage.getItem('ct_login') || sessionStorage.getItem('ct_login_s') || '';
var projects = JSON.parse(localStorage.getItem(currentUser ? 'ct_' + currentUser : 'ctProjects') || '[]');
var currentId = null;
var delTargetId = null;

var THEMES = ['未来工厂','智慧城市','生命盒子','自然公社','太空码头'];
var STAGES = ['提出问题','设计方案','记录数据','分析结论','成果展示'];
var STAGE_NOTES = [
  '在这里写下你的问题，比如：怎么让花盆自动浇水？',
  '你的方案是什么？比如：用传感器和定时器实现自动浇水',
  '记下你观察到的数据，比如：第3天叶片全部舒展',
  '得出什么结论？比如：定时浇水比手工浇水更省水',
  '成果打算怎么展示？比如：做个模型并录制讲解视频'
];
var ABILITIES = ['探究','协作','创新','表达'];

// ---------- AI 教练（离线规则版：根据主题/进度/填写内容生成建议，不上传数据） ----------
var aiSeed = 0;   // 换一批建议时 +1，轮换不同建议

var AI_THEME_IDEAS = {
  '未来工厂': [
    '自动分拣小机器人：用颜色传感器把零件送到不同的盒子',
    '车间噪音报警器：太吵时自动亮灯，提醒戴耳罩',
    '传送带节能：人走开时自动减速或停止',
    '安全头盔检测：没戴头盔，机器就不开工'

// ---------- 密码加密（PBKDF2：随机盐 + SHA-256 + 10万次迭代） ----------
function randSalt() {
  var a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return btoa(String.fromCharCode.apply(null, a));
}

async function deriveKey(pass, salt) {
  // 正常环境（https 页面）：PBKDF2 十万次迭代，给密码"撒盐加密"
  try {
    if (typeof crypto === 'undefined' || !crypto.subtle) throw new Error('no-subtle');
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey(
      'raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' },
      km, 256);
    return btoa(String.fromCharCode.apply(null, new Uint8Array(bits)));
  } catch (e) {
    // http 页面（咱们的服务器暂时没上 https）：浏览器不允许用 crypto.subtle，
    // 退回简易算法——仍然"撒盐"，但强度低。演示够用，正式版必须上 https。
    var h = 0;
    var s2 = String(pass) + '|' + String(salt);
    for (var i = 0; i < s2.length; i++) h = ((h << 5) - h + s2.charCodeAt(i)) | 0;
    return 'demo:' + h;
  }
}

// 问服务器：这个邀请码在别的设备注册的老师那里存在吗（服务器是所有设备的数据中心）
function checkCodeOnServer(code) {
  return new Promise(function (resolve) {
    try {
      var x = new XMLHttpRequest();
      x.open('POST', '/api/checkcode', true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          try {
            var r = JSON.parse(x.responseText);
            resolve(r && r.ok ? r.teacher : null);
          } catch (e) { resolve(null); }
        }
      };
      x.send(JSON.stringify({ t: window.__xjTok || 'xjstar2026', code: code }));
    } catch (e) { resolve(null); }
  });
}

  if (rec.s) {
    // 新版：PBKDF2 验证
    ok = (await deriveKey(p, rec.s)) === rec.h;
  } else {
    // 旧版账号（之前存的简单哈希）：验证通过后自动升级为新加密
    var h = 7;
    for (var i = 0; i < p.length; i++) { h = ((h << 5) - h + p.charCodeAt(i)) | 0; }
    if (String(h) === rec.hash) {
      var ns = randSalt();
      userNames[u] = { s: ns, h: await deriveKey(p, ns), created: rec.created || Date.now(), role: rec.role, code: rec.code };
      localStorage.setItem('ct_users', JSON.stringify(userNames));
      ok = true;
    } else { ok = false; }
  }
  if (!ok) {
    var locked = loginFail();
    closeModal();
    toast(locked ? '连续输错 3 次，锁定 30 秒' : '用户名或密码不对');
    return;
  }
  failTimes = 0;
  // 早期注册的老师账号没有邀请码：登录时自动补一个
  var nu = userNames[u];
  if (nu && nu.role === 'teacher' && !nu.code) {
    nu.code = genCode();
    localStorage.setItem('ct_users', JSON.stringify(userNames));
  }
  applyAccount(u, !!(document.getElementById('acRemember') && document.getElementById('acRemember').checked));
  closeModal();
  toast('欢迎回来，' + u + ' ✔');
}

function loginFail() {
  failTimes++;
  if (failTimes >= 3) {
    lockUntil = Date.now() + 30000;
    failTimes = 0;
    return true;
  }
  return false;
}

async function doReg() {
  var u = document.getElementById('acUser').value.trim();
  var p = document.getElementById('acPass').value;
  var p2 = document.getElementById('acPass2').value;
  if (!/^[\w\u4e00-\u9fa5]{2,16}$/.test(u)) { toast('用户名限 2-16 位，中英文、数字、下划线'); return; }
  if (p.length < 6 || !/[a-zA-Z]/.test(p) || !/[0-9]/.test(p)) { toast('密码至少 6 位，且同时包含字母和数字'); return; }
  if (p !== p2) { toast('两次密码不一致'); return; }
  if (userNames[u]) { toast('这个用户名已被注册'); return; }
  if (u === 'users' || u === 'login' || u === 'login_s') { toast('这个名字不能用'); return; }
  var roleEl = document.getElementById('acRole');
  var role = 'student';
  if (roleEl && roleEl.value === 'teacher') role = 'teacher';
  else if (roleEl && roleEl.value === 'admin') role = 'admin';
  var tk = document.getElementById('acTKey');
  if (role === 'teacher') {
    if (!tk || tk.value !== TEACHER_KEY) { toast('老师口令不对，问老师要口令'); return; }
  }
  var ak = document.getElementById('acAkKey');
  if (role === 'admin') {
    if (!ak || ak.value !== ADMIN_KEY) { toast('管理员口令不对'); return; }
  }
  var s = randSalt();
  var h = await deriveKey(p, s);
  if (role === 'teacher') {
    userNames[u] = { s: s, h: h, created: Date.now(), role: 'teacher', code: genCode() };
  } else if (role === 'admin') {
    userNames[u] = { s: s, h: h, created: Date.now(), role: 'admin' };
  } else {
    // 学生：可填老师邀请码，填了分到对应老师班，不填则先「未分配」
    var tcode = document.getElementById('acTCode') ? document.getElementById('acTCode').value.trim().toUpperCase() : '';
    var tname = '';
    if (tcode) {
      for (var tu in userNames) {
        if (userNames[tu] && userNames[tu].role === 'teacher' && userNames[tu].code === tcode) { tname = tu; break; }
      }
      if (!tname && window.__xjSync) {
        // 本机没有这位老师：去服务器上问（服务器是所有设备共同的数据）
        var tFromServer = await checkCodeOnServer(tcode);
        if (tFromServer) tname = tFromServer;
      }
      if (!tname) { toast('邀请码不存在：请确认老师已在服务器页面（左下角绿点）注册过账号'); return; }
    }
    userNames[u] = { s: s, h: h, created: Date.now(), role: 'student', teacher: tname || undefined };
  }
  if (!userNames[u].teacher) delete userNames[u].teacher;
  localStorage.setItem('ct_users', JSON.stringify(userNames));
  applyAccount(u, false);
  closeModal();
  toast('注册成功 ✔');
}

// ---------- 画能力雷达图（SVG，不用装插件） ----------
function radarSVG(values, size) {
  var cx = size / 2, cy = size / 2, r = size / 2 - 34;
  var n = values.length;
  var s = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';

  for (var level = 2; level <= 10; level += 2) {
    var pts = [];
    for (var i = 0; i < n; i++) {
      var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
      var rr = r * level / 10;
      pts.push((cx + rr * Math.cos(ang)).toFixed(1) + ',' + (cy + rr * Math.sin(ang)).toFixed(1));
    }
    s += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#e0e7f5"/>';
  }
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + r * Math.cos(ang)).toFixed(1) +
         '" y2="' + (cy + r * Math.sin(ang)).toFixed(1) + '" stroke="#e0e7f5"/>';
  }
  var dpts = [];
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    var v = Math.max(0, Math.min(10, Number(values[i]) || 0));
    var rr = r * v / 10;
    dpts.push((cx + rr * Math.cos(ang)).toFixed(1) + ',' + (cy + rr * Math.sin(ang)).toFixed(1));
  }
  // 渐变填充的封闭图形
  s += '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">';
  s += '<stop offset="0%" stop-color="#3b5bdb" stop-opacity="0.45"/>';
  s += '<stop offset="100%" stop-color="#7048e8" stop-opacity="0.25"/>';
  s += '</linearGradient></defs>';
  s += '<polygon points="' + dpts.join(' ') + '" fill="url(#rg)" stroke="#4263eb" stroke-width="2"/>';

  // 顶点圆点 + 分数
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    var v = Math.max(0, Math.min(10, Number(values[i]) || 0));
    var rr = r * v / 10;
    var px = cx + rr * Math.cos(ang), py = cy + rr * Math.sin(ang);
    s += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="4" fill="#fff" stroke="#4263eb" stroke-width="2"/>';
    var lx = cx + (r + 20) * Math.cos(ang);
    var ly = cy + (r + 20) * Math.sin(ang);
    s += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) +
         '" font-size="12" font-weight="700" fill="#333" text-anchor="middle" dominant-baseline="middle">'
         + ABILITIES[i] + ' ' + v + '</text>';
  }
  s += '</svg>';
  return s;
}

// ---------- 顶部统计 ----------
function renderStats() {
  // 管理员：顶部统计显示全部老师/学生/项目
  if (isAdmin()) {
    var gg = allStudentsInfo();
    document.getElementById('stats').innerHTML =
      '<div class="stat"><b>' + gg.teachers.length + '</b><span>老师数</span></div>' +
      '<div class="stat"><b>' + gg.stuN + '</b><span>学生数</span></div>' +
      '<div class="stat"><b>' + gg.projN + '</b><span>项目总数</span></div>' +
      '<div class="stat"><b>' + gg.pend + '</b><span>待点评</span></div>';
    return;
  }
  // 老师：顶部统计显示全班数据，而不是自己的（老师不建项目）
  if (isTeacher()) {
    var cl = classList();
    var mine = cl.mine, free = cl.free;
    var projN2 = 0, doneN2 = 0, pend = 0;
    for (var mi = 0; mi < mine.length; mi++) {
      for (var mj = 0; mj < mine[mi].items.length; mj++) {
        projN2++;
        for (var mk = 0; mk < mine[mi].items[mj].p.stages.length; mk++) if (mine[mi].items[mj].p.stages[mk].done) doneN2++;
        if (!mine[mi].items[mj].p.mentor) pend++;
      }
    }
    var pct2 = projN2 ? Math.round(doneN2 / projN2 / 5 * 100) : 0;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><b>' + mine.length + '</b><span>我班学生</span></div>' +
      '<div class="stat"><b>' + projN2 + '</b><span>项目总数</span></div>' +
      '<div class="stat"><b>' + pend + '</b><span>待点评</span></div>' +
      '<div class="stat"><b>' + free.length + '</b><span>未分配</span></div>';
    return;
  }
  var recs = 0, scores = [], done = 0, total = 0;
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    recs += p.records.length;
    for (var k = 0; k < p.reviews.length; k++) scores.push(p.reviews[k].score);
    for (var j = 0; j < p.stages.length; j++) { if (p.stages[j].done) done++; total++; }
  }
  var avg = scores.length ? (scores.reduce(function(a,b){ return a + b; }, 0) / scores.length).toFixed(1) : '—';
  var pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('stats').innerHTML =
    '<div class="stat"><b>' + projects.length + '</b><span>项目总数</span></div>' +
    '<div class="stat"><b>' + recs + '</b><span>记录总数</span></div>' +
    '<div class="stat"><b>★ ' + avg + '</b><span>互评平均分</span></div>' +
    '<div class="stat"><b>' + pct + '%</b><span>整体进度</span></div>';
}

// ---------- 新建项目 ----------
function addProject() {
  var name = document.getElementById('pname').value.trim();
  var theme = document.getElementById('ptheme').value;
  var members = document.getElementById('pmembers').value.trim();
  if (!name) { toast('请先写项目名字'); return; }

  var stageList = [];
  for (var i = 0; i < STAGES.length; i++) {
    stageList.push({ name: STAGES[i], done: false, note: '' });
  }

  projects.push({
    id: Date.now(),
    name: name,
    theme: theme,
    members: members ? members.split(/[,，、\s]+/) : [],
    stages: stageList,
    records: [],
    reviews: [],
    mentor: '',
    ability: [4, 4, 4, 4],
    table: { cols: ['日期', '观察数据', '备注'], rows: [] }
  });

  document.getElementById('pname').value = '';
  document.getElementById('pmembers').value = '';
  save();
  renderStats();
  renderList();
  toast('项目已创建 ✔');
}

function doneCount(p) {
  var n = 0;
  for (var i = 0; i < p.stages.length; i++) if (p.stages[i].done) n++;
  return n;
}

// ---------- 项目列表（搜索 + 筛选 + 排序） ----------
function renderList() {
  var kw = document.getElementById('kw').value.trim().toLowerCase();
  var theme = document.getElementById('themeFilter').value;
  var sortBy = document.getElementById('sortBy').value;
  var list = document.getElementById('list');

  var shown = [];
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    var okTheme = theme === '全部' || p.theme === theme;
    var hay = (p.name + ' ' + p.members.join(' ')).toLowerCase();
    var okKw = !kw || hay.indexOf(kw) >= 0;
    if (okTheme && okKw) shown.push(p);
  }

  if (sortBy === 'progress') {
    shown.sort(function(a, b) { return doneCount(b) - doneCount(a); });
  } else if (sortBy === 'new') {
    shown.sort(function(a, b) { return b.id - a.id; });
  } else {
    shown.sort(function(a, b) { return a.name.localeCompare(b.name, 'zh'); });
  }

  if (shown.length === 0) {
    list.innerHTML = '<div class="empty">📭 没有符合的项目，试试别的关键词，或者新建一个吧</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < shown.length; i++) {
    var p = shown[i];
    var d = doneCount(p);
    var pct = Math.round(d / p.stages.length * 100);
    html += '<div class="proj" onclick="openProject(' + p.id + ')">' +
      '<div class="top"><span class="name">' + esc(p.name) + '</span>' +
      '<span class="tag">' + esc(p.theme) + '</span></div>' +
      '<div class="meta">👥 ' + (p.members.length ? esc(p.members.join('、')) : '（未填写成员）') +
      '　📅 ' + new Date(p.id).toLocaleDateString() + '</div>' +
      '<div class="pbar"><span class="pfill" style="width:' + pct + '%"></span></div>' +
      '<div class="pct">进度 ' + d + '/' + p.stages.length + '（' + pct + '%）' +
      '　📝 记录 ' + p.records.length + '　⭐ 互评 ' + p.reviews.length + '</div>' +
      '</div>';
  }
  list.innerHTML = html;
}

function editProject(id) {

  name = name.trim();

  if (theme === null) return;
  theme = theme.trim();

  p.members = m.trim() ? m.trim().split(/[,，、\s]+/) : [];

    var rv = p.reviews[m];
    html += '<div class="rev"><span class="from">' + esc(rv.from || '匿名') + '</span>' +
            '<span class="stars">' + '★'.repeat(rv.score || 1) + '</span>' +
            '<span class="cmt">' + esc(rv.comment) + '</span>' +
            '<button class="btn-g del" onclick="delReview(' + p.id + ',' + m + ')">✕</button></div>';
  }

  // 4. 导师点评 —— 只给老师看：学生自己查看详情时不显示（老师从班级总览「查看/点评」进来 = 老师模式）
  if (viewAs) {
    html += '<h3>导师点评</h3>';
    html += '<textarea id="mentorText" placeholder="老师的点评">' + esc(p.mentor || '') + '</textarea><br>';
    html += '<button class="btn-p" onclick="saveMentor(' + p.id + ')">保存点评</button>';
  }

  // 5. 能力雷达（滑杆调节）
  html += '<h3>能力雷达</h3>';
  html += '<div id="radarBox" style="text-align:center;">' + radarSVG(p.ability, 260) + '</div>';
  html += '<div style="display:flex; flex-wrap:wrap; justify-content:center; margin-top:4px;">';
  for (var a = 0; a < ABILITIES.length; a++) {
    html += '<span class="ab"><span class="abName">' + ABILITIES[a] + '</span>' +
            '<input id="ab' + a + '" type="range" min="0" max="10" step="1" value="' + p.ability[a] + '"' +
            ' oninput="setAbilityVal(this.value,' + a + ')">' +
            '<b id="abv' + a + '">' + p.ability[a] + '</b></span>';
  }
  html += '</div>';
  html += '<div style="text-align:center;">' +
          '<button class="btn-p" onclick="saveAbility(' + p.id + ')">保存分数</button> ' +
          '<button class="btn-g" onclick="autoAbility(' + p.id + ')">按进度自动填</button></div>';

  // 6. 档案与输出
  html += '<h3>项目档案</h3>';
  html += '<button class="btn-p" onclick="exportHTML(' + p.id + ')">📄 生成精美档案</button> ';
  html += '<button class="btn-g" onclick="exportTxt(' + p.id + ')">导出 TXT</button> ';
  html += '<button class="btn-g" onclick="openParent(' + p.id + ')">👨‍👩‍👧 家长查看页</button> ';
  html += '<button class="btn-g" onclick="closeDetail()">关闭</button>';

  html += '</div>';
  box.innerHTML = html;
}

function setAbilityVal(v, a) {
  document.getElementById('abv' + a).textContent = v;
  tmpAbility[a] = Number(v) || 0;
  // 拖动时实时重画雷达图，让图形跟着手走
  var rb = document.getElementById('radarBox');
  if (rb) rb.innerHTML = radarSVG(tmpAbility, 260);
}

// ---------- 各操作 ----------
function toggleStage(id, index) {
  var p = findProject(id);
  p.stages[index].done = !p.stages[index].done;
  save();
  renderStats();
  renderList();
  renderDetail();
}

// 保存每一步里填写的具体内容（提出问题这一步填的就是问题）
function saveStageNote(id, index, text) {
  var p = findProject(id);
  p.stages[index].note = text.trim();
  save();
  toast('已保存 ✔');
}

function addRecord(id) {
  var p = findProject(id);
  var text = document.getElementById('recText').value.trim();
  var file = document.getElementById('recFile').files[0];
  if (!text && !file) { toast('写点内容或选张图片吧'); return; }

  var now = new Date().toLocaleString();
  if (file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      p.records.push({ time: now, text: text, img: e.target.result });
      save();
      renderStats();
      renderList();
      renderDetail();
      toast('记录已添加 ✔');
    };
    reader.readAsDataURL(file);
  } else {
    p.records.push({ time: now, text: text, img: '' });
    save();
    renderStats();
    renderList();
    renderDetail();
    toast('记录已添加 ✔');
  }
}

function delRecord(id, index) {
  var p = findProject(id);
  p.records.splice(index, 1);
  save();
  renderStats();
  renderList();
  renderDetail();
  toast('记录已删除');
}

function addReview(id) {
  var p = findProject(id);
  var from = document.getElementById('revFrom').value.trim();
  var score = Number(document.getElementById('revScore').value);
  var comment = document.getElementById('revComment').value.trim();
  if (!comment) { toast('写一句评语再提交吧'); return; }
  p.reviews.push({ from: from, score: score, comment: comment });
  document.getElementById('revComment').value = '';
  save();
  renderStats();
  renderList();
  renderDetail();
  toast('互评已提交 ✔');
}

function delReview(id, index) {
  var p = findProject(id);
  p.reviews.splice(index, 1);
  save();
  renderStats();
  renderList();
  renderDetail();
}

function saveMentor(id) {
  var p = findProject(id);
  var t = document.getElementById('mentorText').value.trim();
  p.mentor = t;
  save();
  if (t) toast('点评已保存 ✔');
  else toast('点评已清空');
}

function saveAbility(id) {
  var p = findProject(id);
  for (var a = 0; a < ABILITIES.length; a++) {
    p.ability[a] = Number(document.getElementById('ab' + a).value) || 0;
  }
  save();
  renderDetail();
  toast('能力分数已保存 ✔');
}

function autoAbility(id) {
  var p = findProject(id);
  var d = doneCount(p), withImg = 0;
  for (var k = 0; k < p.records.length; k++) if (p.records[k].img) withImg++;

  p.ability[0] = Math.min(10, Math.round(d / p.stages.length * 6) + Math.min(p.records.length, 4));
  p.ability[1] = Math.min(10, p.reviews.length + p.members.length);
  p.ability[2] = Math.min(10, 2 + withImg);
  p.ability[3] = p.stages[p.stages.length - 1].done ? 8 : 4;

  save();
  renderDetail();
  toast('已按进度自动填分，可以再手动微调');
}

// ---------- 导出 TXT ----------
function exportTxt(id) {
  var p = findProject(id);
  var t = '【科创项目档案】\n';
  t += '项目名称：' + p.name + '\n';
  t += '主题：' + p.theme + '\n';
  t += '成员：' + (p.members.join('、') || '（未填写）') + '\n\n';

  t += '【阶段进度】\n';
  for (var i = 0; i < p.stages.length; i++) {
    t += (i + 1) + '. ' + p.stages[i].name + (p.stages[i].done ? ' 已完成' : ' 未完成');
    if (p.stages[i].note) t += (i === 0 ? '（问题：' : '（内容：') + p.stages[i].note + '）';
    t += '\n';
  }

  t += '\n【能力评分】\n';
  for (var a = 0; a < ABILITIES.length; a++) {
    t += ABILITIES[a] + '：' + p.ability[a] + '/10\n';
  }

  t += '\n【过程记录】\n';
  for (var k = 0; k < p.records.length; k++) {
    t += (k + 1) + '. [' + p.records[k].time + '] ' + p.records[k].text +
         (p.records[k].img ? '（含图片）' : '') + '\n';
  }

  t += '\n【数据表格】\n';
  var tb = tblNorm(p);
  t += tb.cols.join(' | ') + '\n';
  for (var r = 0; r < tb.rows.length; r++) {
    t += tb.rows[r].join(' | ') + '\n';
  }

  t += '\n【同伴互评】\n';
  for (var m = 0; m < p.reviews.length; m++) {
    t += (p.reviews[m].from || '匿名') + '：' + '★'.repeat(p.reviews[m].score || 1) +
         ' ' + p.reviews[m].comment + '\n';
  }

  t += '\n【导师点评】\n' + (p.mentor || '（暂无）') + '\n';

  var blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
  var a2 = document.createElement('a');
  a2.href = URL.createObjectURL(blob);
  a2.download = p.name + '_项目档案.txt';
  a2.click();
}

// ---------- 数据表格（记录实验数据，可导出 Excel） ----------
// 旧项目没有 table 字段时，给出默认表格结构
function tblNorm(p) {
  if (!p.table || !p.table.cols || !p.table.rows) {
    p.table = { cols: ['日期', '观察数据', '备注'], rows: [] };
  }
  return p.table;
}

// 加一列
function addTCol(id) {
  var p = findProject(id);
  var t = tblNorm(p);
  t.cols.push('新列');
  for (var i = 0; i < t.rows.length; i++) t.rows[i].push('');
  save();
  renderDetail();
}

// 删一列（至少留 1 列）
function delTCol(id, ci) {
  var p = findProject(id);
  var t = tblNorm(p);
  if (t.cols.length <= 1) { toast('至少保留 1 列'); return; }
  t.cols.splice(ci, 1);
  for (var i = 0; i < t.rows.length; i++) t.rows[i].splice(ci, 1);
  save();
  renderDetail();
}

// 加一行
function addTRow(id) {
  var p = findProject(id);
  var t = tblNorm(p);
  var row = [];
  for (var i = 0; i < t.cols.length; i++) row.push('');
  t.rows.push(row);
  save();
  renderDetail();
}

// 删一行
function delTRow(id, ri) {
  var p = findProject(id);
  var t = tblNorm(p);
  t.rows.splice(ri, 1);
  save();
  renderDetail();
}

// 保存表格内容（把输入框的值写回数据）
function saveTable(id) {
  var p = findProject(id);
  var t = tblNorm(p);
  for (var i = 0; i < t.cols.length; i++) {
    var c = document.getElementById('tcol' + i);
    if (c) t.cols[i] = c.value.trim() || '列' + (i + 1);
  }
  for (var r = 0; r < t.rows.length; r++) {
    for (var c2 = 0; c2 < t.cols.length; c2++) {
      var cell = document.getElementById('tcell' + r + '_' + c2);
      t.rows[r][c2] = cell ? cell.value : '';
    }
  }
  save();
  toast('表格已保存 ✔');
}

// 导出 CSV（用 Excel 能直接打开）
function exportCSV(id) {
  var p = findProject(id);
  var t = tblNorm(p);
  var lines = [];
  lines.push(t.cols.map(csvCell).join(','));
  for (var i = 0; i < t.rows.length; i++) {
    lines.push(t.rows[i].map(csvCell).join(','));
  }
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = p.name + '_数据表格.csv';
  a.click();
  toast('CSV 已导出，可用 Excel 打开');
}

function csvCell(s) {
  s = String(s == null ? '' : s);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// 渲染表格区块
function tblHTML(p) {
  var t = tblNorm(p);
  var h = '<h3>数据表格</h3>';
  h += '<p style="color:var(--muted); font-size:12px; margin:2px 0 8px;">把实验数据一行行记下来（如日期、温度、湿度），最后能导出成 Excel。</p>';

  // 表头（可编辑列名）
  h += '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">';
  for (var i = 0; i < t.cols.length; i++) {
    h += '<div style="display:flex; align-items:center; gap:2px;">' +
         '<input id="tcol' + i + '" value="' + escAttr(t.cols[i]) + '" style="width:100px;">' +
         '<button class="btn-g del" onclick="delTCol(' + p.id + ',' + i + ')" title="删列">✕</button></div>';
  }
  h += '<button class="btn-g" onclick="addTCol(' + p.id + ')">＋ 加一列</button></div>';

  // 数据行
  if (t.rows.length === 0) {
    h += '<p style="color:var(--muted); font-size:13px;">（还没有数据行）</p>';
  } else {
    for (var r = 0; r < t.rows.length; r++) {
      h += '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">';
      for (var c = 0; c < t.cols.length; c++) {
        h += '<input id="tcell' + r + '_' + c + '" value="' + escAttr(t.rows[r][c] || '') +
             '" style="width:100px;" placeholder="' + escAttr(t.cols[c]) + '">';
      }
      h += '<button class="btn-g del" onclick="delTRow(' + p.id + ',' + r + ')">✕</button></div>';
    }
  }
  h += '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
       '<button class="btn-p" onclick="addTRow(' + p.id + ')">＋ 加一行</button> ' +
       '<button class="btn-p" onclick="saveTable(' + p.id + ')">保存表格</button> ' +
       '<button class="btn-g" onclick="exportCSV(' + p.id + ')">📊 导出 Excel</button></div>';

  return h;
}

// ---------- AI 助教（离线问答聊天窗，模拟 DeepSeek 式对话） ----------
var aiMsgs = [];          // 对话记录 [{role:'me'|'ai', text}]
var aiTypingOn = false;

function aiToggle() {
  var p = document.getElementById('aiPanel');
  var isShow = p.className.indexOf('show') >= 0;
  p.className = isShow ? '' : 'show';
  if (!isShow && aiMsgs.length === 0) {
    aiMsgs.push({ role: 'ai', text: '你好呀！我是星迹的 AI 助教。你可以问我怎么做项目、怎么用这个软件；打开一个项目后，还能让我「看看你的项目」或帮你写简介。试试下面的快捷问题：' });
    aiRender();

}

function aiRender() {
  var m = document.getElementById('aiMsgs');
  var h = '';
  for (var i = 0; i < aiMsgs.length; i++) {
    h += '<div class="aiBub ' + (aiMsgs[i].role === 'me' ? 'me' : 'ai') + '">' + esc(aiMsgs[i].text) + '</div>';
  }

function aiChips(list) {

    h += '<button onclick="aiChip(\'' + list[i] + '\')">' + esc(list[i]) + '</button>';
  }

}

function aiQuickChips() {
  var p = findProject(currentId);

  return ['怎么完成一个科创项目', '有哪些主题可以选', '什么是同伴互评', '怎么导出档案'];
}

function aiChip(t) {

}

function aiSend() {

// 假装"思考"一会儿再回答
function aiAnswer(t) {

    aiChips(aiQuickChips());

}

// 离线问答库：按关键词打分，选最匹配的一条
function aiAsk(t) {
  var p = findProject(currentId);

    { keys: ['看看我的项目', '我的项目怎么样', '进展'], out: function () { return p ? aiProgress(p) : '先点开一个项目（在列表里点它的名字），然后我再帮你分析。' } },
    { keys: ['写项目简介', '简介', '介绍'], out: function () { return p ? aiIntro(p) : '先点开一个项目，我就能根据它的主题、进度和记录帮你写一段简介。' } },
    { keys: ['下一步', '接下来', '该做什么'], out: function () { return p ? aiNext(p) : '先点开一个项目，我告诉你下一步该做什么。' } },
    { keys: ['计划', '安排', '时间', '完成'], out: function () { return '一个科创项目通常分 5 步走：\n①提出问题（写清现象和想解决的问题）\n②设计方案（材料、步骤、分工、预算）\n③记录数据（每天固定时间记，多拍照）\n④分析结论（比较数据，找规律）\n⑤成果展示（讲解+视频+海报）\n在「星迹」里，每一步都对应一个阶段，做完就勾掉。' } },
    { keys: ['主题', '选题', '选什么'], out: function () { return '目前有 5 个主题可选：\n· 未来工厂（自动分拣、噪音报警、传送带节能…）\n· 智慧城市（自动浇花、声控灯、雨伞柜、垃圾桶提醒…）\n· 生命盒子（孵化器、水质监测、豆芽对比、缺水报警…）\n· 自然公社（雨水收集、堆肥箱、鸟窝温度计…）\n· 太空码头（太阳系模型、太空菜园、陨石报警…）\n选一个你每天都能看到、愿意观察的方向，就是好主题。' } },
    { keys: ['提出问题', '怎么写问题', '问题怎么'], out: function () { return aiStage(0); } },
    { keys: ['设计', '方案'], out: function () { return aiStage(1); } },
    { keys: ['记录', '数据', '观察'], out: function () { return aiStage(2); } },
    { keys: ['结论', '分析', '总结'], out: function () { return aiStage(3); } },
    { keys: ['展示', '成果', '视频', '比赛', '演讲'], out: function () { return aiStage(4); } },
    { keys: ['互评', '评分', '打分', '评'], out: function () { return '同伴互评是星迹的特色：项目完成或进行中，邀请同学给你打 1-5 星并留言。\n· 每个人都能看到大家的评价\n· 互评次数会算进「协作」能力分\n· 一句「哪里还能改进」比满分更值钱\n在项目详情里往下滚，找到「同伴互评」就能评。' } },
    { keys: ['雷达', '能力', '分数'], out: function () { return '能力雷达有 4 个维度：探究、协作、创新、表达。\n· 拖动滑杆就能调分，雷达图会跟着动\n· 点「按进度自动填」，程序根据完成度、记录数、互评数自动估分\n· 分数存在项目里，导出档案时会一起带走' } },
    { keys: ['档案', '导出', '家长', '打印', 'pdf'], out: function () { return '项目详情页底部有 3 个按钮：\n· 生成精美档案：做成一页漂亮的可打印报告（选打印就能存成 PDF）\n· 导出 TXT：纯文字版，方便复制\n· 家长查看页：给爸爸妈妈看的只读页面，还有「AI 给家长的话」' } },
    { keys: ['注册', '登录', '账号', '密码'], out: function () { return '点右上角「注册」建账号，之后点「登录」进自己的空间。\n· 每个人的项目数据互相隔离\n· 密码做了加密存储，连续输错 3 次会锁 30 秒\n· 不勾「记住我」的话，关掉浏览器就自动退出\n（演示版账号存在本机浏览器，换电脑看不到，正式版要接服务器）' } },
    { keys: ['你好', '您好', 'hi', 'hello', '在吗', '谢谢'], out: function () { return '你好呀！我现在是离线演示版，靠内置知识库回答。你可以问：怎么完成项目、有哪些主题、什么是互评……也可以打开一个项目让我帮你分析。' } }
  ];

  var best = null, bestScore = 0;
  for (var i = 0; i < table.length; i++) {
    var score = 0;
    for (var k = 0; k < table[i].keys.length; k++) {
      if (txt.indexOf(table[i].keys[k]) >= 0) score += table[i].keys[k].length;
    }
    if (score > bestScore) { bestScore = score; best = table[i]; }
  }
  if (best) return best.out();
  return '这个问题超出我的离线知识库啦（我是演示版，不联网）。你可以换个问法，比如：\n· 「怎么完成一个科创项目」\n· 「有哪些主题可以选」\n· 打开项目后问我「帮我看看我的项目」';
}

function aiProgress(p) {
  var d = doneCount(p);
  var pct = Math.round(d / p.stages.length * 100);
  var s = '《' + p.name + '》：' + p.theme + '主题，目前完成 ' + d + '/' + p.stages.length + ' 步（' + pct + '%）。';
  var nextIdx = -1;
  for (var i = 0; i < p.stages.length; i++) { if (!p.stages[i].done) { nextIdx = i; break; } }
  if (nextIdx >= 0) s += '\n下一步是「' + p.stages[nextIdx].name + '」。' + aiStage(nextIdx);
  else s += '\n五个阶段全部完成！记得导出档案、邀请同学互评。';
  if (p.reviews.length) s += '\n收到 ' + p.reviews.length + ' 条互评，平均 ' + (p.reviews.reduce(function (a, r) { return a + r.score; }, 0) / p.reviews.length).toFixed(1) + ' 星。';
  return s;
}

function aiIntro(p) {
  var d = doneCount(p);
  var pct = Math.round(d / p.stages.length * 100);
  var s = '《' + p.name + '》是一个「' + p.theme + '」主题的科创项目，目前完成了 ' + d + '/' + p.stages.length + ' 个阶段（' + pct + '%）。';
  if (p.stages[0].note) s += '\n小组关注的问题是：' + p.stages[0].note;
  var nextIdx = -1;
  for (var i = 0; i < p.stages.length; i++) { if (!p.stages[i].done) { nextIdx = i; break; } }
  s += '\n下一步按计划是「' + (nextIdx >= 0 ? p.stages[nextIdx].name : '成果打磨与互评') + '」。';
  if (p.members.length) s += '\n参与成员：' + p.members.join('、') + '。';
  return s;
}

function aiNext(p) {
  var nextIdx = -1;
  for (var i = 0; i < p.stages.length; i++) { if (!p.stages[i].done) { nextIdx = i; break; } }
  if (nextIdx < 0) return '五个阶段全完成啦！建议：导出精美档案 + 邀请 3 位同学互评 + 录一段 1 分钟讲解视频。';
  return '下一步是「' + p.stages[nextIdx].name + '」。' + aiStage(nextIdx);
}

function aiStage(i) {
  var tips = AI_STAGE_TIPS[i];
  return tips.join('\n');
}

// ---------- 老师端：班级项目总览 ----------
// 枚举本机 localStorage 里所有键（浏览器标准接口）
function storeKeys() {
  var ks = [];
  for (var i = 0; i < localStorage.length; i++) ks.push(localStorage.key(i));
  // 服务器上还有别处注册的账号键，本地没存，也要算上（多台设备共用时）
  var cache = window.__xjCache || {};
  for (var k in cache) if (cache.hasOwnProperty(k) && ks.indexOf(k) < 0) ks.push(k);
  return ks;
}

// 生成老师邀请码（4 位，避开易混淆的 0/O/1/I）
function genCode() {
  var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var c;
  do {
    c = '';
    for (var i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  } while (codeTaken(c));
  return c;
}
function codeTaken(c) {
  for (var u in userNames) if (userNames[u].code === c) return true;
  return false;
}

// 收集学生账号：mine=分到我班的学生(含项目)，free=还没分配老师的学生(可供接收)
function classList() {
  var mine = [], free = [];
  var keys = storeKeys();
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (k.indexOf('ct_') !== 0) continue;
    if (k === 'ct_users' || k === 'ct_login' || k === 'ct_login_s' || k === 'ct_apps') continue; // 账号表/登录态/进班申请不算学生
    var who = k.slice(3);
    if (who === currentUser) continue;
    if (userNames[who] && (userNames[who].role === 'teacher' || userNames[who].role === 'admin')) continue; // 老师/管理员账号不算学生
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { continue; }
    var items = [];
    for (var j = 0; j < arr.length; j++) items.push({ who: who, p: arr[j] });
    var t = userNames[who] && userNames[who].teacher;
    if (t) { if (t === currentUser) mine.push({ who: who, rec: userNames[who], items: items }); }
    else free.push({ who: who, items: items });
  }
  return { mine: mine, free: free };
}

function openClass() {
  if (!isTeacher() && !isAdmin()) return;
  viewAs = null;
  currentId = null;
  applyRoleUI();
  if (isAdmin()) renderGlobalOverview(); else renderClassOverview();
  document.getElementById('detail').scrollIntoView({ behavior: 'smooth' });
}

function renderClassOverview() {
  var box = document.getElementById('detail');
  var cl = classList();
  var mine = cl.mine, free = cl.free;
  var projN = 0, doneN = 0, pending = 0;
  for (var i = 0; i < mine.length; i++) {
    for (var j = 0; j < mine[i].items.length; j++) {
      projN++;
      var d = 0;
      for (var s = 0; s < mine[i].items[j].p.stages.length; s++) if (mine[i].items[j].p.stages[s].done) d++;
      doneN += d;
      if (!mine[i].items[j].p.mentor) pending++;
    }
  }
  var myCode = userNames[currentUser].code || '';
  var avg = projN ? Math.round(doneN / projN / 5 * 100) : 0;
  var h = '<div class="box">';
  h += '<h2>📚 我的班级</h2>';
  if (myCode) h += '<p class="invite" style="font-size:14px;">🔑 你的邀请码：<b>' + myCode +
    '</b> <button class="btn-g" onclick="copyCode()" style="padding:2px 10px;font-size:12px;">复制</button>' +
    '<span style="font-size:12px;color:var(--muted);">　学生注册时填这个码（不用管大小写），就会分到你班</span></p>';
  h += '<p style="font-size:12px;color:var(--muted);">我班 ' + mine.length + ' 名学生、' + projN +
       ' 个项目，平均进度 ' + avg + '%，待点评 ' + pending + ' 个，未分配学生 ' + free.length + ' 名。</p>';

  // —— 我班学生 ——
  h += '<h3 style="margin-top:14px;">🧑‍🎓 我班学生（' + mine.length + '）</h3>';
  if (!mine.length) {
    h += '<p style="color:var(--muted);font-size:13px;">还没有学生。把上面的邀请码告诉学生，或从下方「未分配学生」里接收。</p>';
  } else {
    for (var m = 0; m < mine.length; m++) {
      var st = mine[m];
      if (!st.items.length) {
        h += '<div class="classrow"><span class="cwho">👤 ' + esc(st.who) + '</span>' +
             '<span class="ctag">0 个项目</span>' +
             '<button class="btn-g" onclick="unassignStudent(\'' + st.who + '\')">移出班级</button></div>';
        continue;
      }
      for (var j2 = 0; j2 < st.items.length; j2++) {
        var it = st.items[j2];
        var d2 = 0;
        for (var s2 = 0; s2 < it.p.stages.length; s2++) if (it.p.stages[s2].done) d2++;
        var pct = Math.round(d2 / it.p.stages.length * 100);
        h += '<div class="classrow"><span class="cwho">👤 ' + esc(it.who) + '</span>' +
             '<span class="cname">' + esc(it.p.name) + '</span>' +
             '<span class="ctag">' + esc(it.p.theme) + '</span>' +
             '<span class="ctag">' + pct + '%</span>' +
             '<span class="ctag">' + (it.p.mentor ? '✅已点评' : '⬜未点评') + '</span>' +
             '<button class="btn-p" onclick="teacherOpen(\'' + it.who + '\',' + it.p.id + ')">查看 / 点评</button>' +
             '<button class="btn-g" onclick="unassignStudent(\'' + it.who + '\')">移出班级</button></div>';
      }
    }
  }

  // —— 待审批申请（学生主动申请进班） ——
  var apps1 = pendingApps();
  var myApps = [];
  for (var sid in apps1) if (apps1[sid] && apps1[sid].tid === currentUser) myApps.push({ sid: sid, tid: apps1[sid].tid });
  h += '<h3 style="margin-top:14px;">📥 待审批申请（' + myApps.length + '）</h3>';
  if (!myApps.length) {
    h += '<p style="color:var(--muted);font-size:13px;">没有待审批申请。没进班的学生会在自己页面右上角选老师申请进班。</p>';
  } else {
    for (var ai = 0; ai < myApps.length; ai++) {
      h += '<div class="classrow"><span class="cwho">👤 ' + esc(myApps[ai].sid) + '</span>' +
           '<span class="ctag">申请进你的班</span>' +
           '<button class="btn-p" onclick="approveStudent(\'' + myApps[ai].sid + '\',\'' + myApps[ai].tid + '\')">✅ 同意</button> ' +
           '<button class="btn-g" onclick="rejectStudent(\'' + myApps[ai].sid + '\')">✖ 拒绝</button></div>';
    }
  }

  // —— 未分配学生 ——
  h += '<h3 style="margin-top:14px;">📥 未分配学生（' + free.length + '）</h3>';
  if (!free.length) {
    h += '<p style="color:var(--muted);font-size:13px;">没有未分配学生，大家的账号都有老师了。</p>';
  } else {

      h += '<div class="classrow"><span class="cwho">👤 ' + esc(fs.who) + '</span>' +

           '<button class="btn-p" onclick="claimStudent(\'' + fs.who + '\')">接收 · 收进我班</button></div>';
    }
  }

  h += '<div style="margin-top:12px;"><button class="btn-g" onclick="backToWork()">↻ 刷新</button> ' +
       '<span class="tips" style="font-size:12px;color:var(--muted);">演示版：班级数据来自这台电脑浏览器里注册的学生账号，换电脑看不到。</span></div>';
  h += '</div>';
  box.innerHTML = h;
}

// ---------- 管理员全局总览 ----------
// 收集全部老师、全部学生（按班分组）、未分配学生，以及项目统计
function allStudentsInfo() {
  var teachers = [], groups = {};
  for (var tu in userNames) {
    if (userNames[tu] && userNames[tu].role === 'teacher') {
      if (tu === currentUser) continue;   // 管理员不会也叫这个名字；保险跳过
      teachers.push({ who: tu, code: userNames[tu].code || '' });
      groups[tu] = { who: tu, code: userNames[tu].code || '', students: {} };
    }
  }
  var free = [];
  var keys = storeKeys();
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (k.indexOf('ct_') !== 0) continue;
    if (k === 'ct_users' || k === 'ct_login' || k === 'ct_login_s' || k === 'ct_apps') continue;
    var who = k.slice(3);
    if (who === currentUser) continue;
    var rec = userNames[who];
    if (!rec || rec.role === 'teacher' || rec.role === 'admin') continue;
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { continue; }
    var items = [];
    for (var j = 0; j < arr.length; j++) items.push({ who: who, p: arr[j] });
    if (rec.teacher && groups[rec.teacher]) groups[rec.teacher].students[who] = items;
    else free.push({ who: who, rec: rec, items: items });
  }
  var stuN = 0, projN = 0, pend = 0;
  for (var g in groups) {
    for (var w2 in groups[g].students) {
      stuN++;
      projN += groups[g].students[w2].length;
      for (var it = 0; it < groups[g].students[w2].length; it++) if (!groups[g].students[w2][it].p.mentor) pend++;
    }
  }
  for (var f = 0; f < free.length; f++) {
    stuN++;
    projN += free[f].items.length;
    for (var it2 = 0; it2 < free[f].items.length; it2++) if (!free[f].items[it2].p.mentor) pend++;
  }
  return { teachers: teachers, groups: groups, free: free, stuN: stuN, projN: projN, pend: pend };
}

// 管理员视角：全部老师 + 全部学生与其项目（可查看/点评），+ 未分配学生
function renderGlobalOverview() {
  var box = document.getElementById('detail');
  var g = allStudentsInfo();
  var h = '<div class="box">';
  h += '<h2>🌐 全局总览（管理员）</h2>';
  var appsG = pendingApps();
  var appN = 0;
  for (var kk in appsG) if (appsG[kk]) appN++;
  h += '<p style="font-size:12px;color:var(--muted);">共 ' + g.teachers.length + ' 位老师、' + g.stuN +
       ' 名学生、' + g.projN + ' 个项目，待点评 ' + g.pend + ' 个，待审批 ' + appN + ' 个。</p>';

  h += '<h3 style="margin-top:14px;">🧑‍🏫 全部老师（' + g.teachers.length + '）</h3>';
  if (!g.teachers.length) {
    h += '<p style="color:var(--muted);font-size:13px;">还没有老师。用老师口令注册第一个老师吧。</p>';
  } else {
    for (var t = 0; t < g.teachers.length; t++) {
      var tw = g.teachers[t];
      var cnt = 0;
      for (var ww in g.groups[tw.who].students) cnt++;
      h += '<div class="classrow"><span class="cwho">🧑‍🏫 ' + esc(tw.who) + '</span>' +
           '<span class="ctag">邀请码 ' + esc(tw.code || '—') + '</span>' +
           '<span class="ctag">' + cnt + ' 名学生</span></div>';
    }
  }

  h += '<h3 style="margin-top:14px;">📥 待审批申请（' + appN + '）</h3>';
  if (!appN) {
    h += '<p style="color:var(--muted);font-size:13px;">没有待审批申请。</p>';
  } else {
    for (var ka in appsG) {
      if (!appsG[ka]) continue;
      h += '<div class="classrow"><span class="cwho">👤 ' + esc(ka) + '</span>' +
           '<span class="ctag">申请进 ' + esc(appsG[ka].tid) + ' 老师的班</span>' +
           '<button class="btn-p" onclick="approveStudent(\'' + ka + '\',\'' + appsG[ka].tid + '\')">✅ 同意</button> ' +
           '<button class="btn-g" onclick="rejectStudent(\'' + ka + '\')">✖ 拒绝</button></div>';
    }
  }

  h += '<h3 style="margin-top:14px;">🧑‍🎓 全部学生与其项目（' + g.stuN + '）</h3>';
  var anyStu = false;
  for (var gt in g.groups) {
    var stus = g.groups[gt].students;
    var stKeys = Object.keys(stus);
    if (!stKeys.length) continue;
    h += '<p style="font-size:13px;margin-top:8px;">📍 <b>' + esc(gt) + '</b> 老师班：</p>';
    for (var si = 0; si < stKeys.length; si++) {
      var w3 = stKeys[si];
      if (!stus[w3].length) {
        h += '<div class="classrow"><span class="cwho">👤 ' + esc(w3) + '</span><span class="ctag">0 个项目</span></div>';
        anyStu = true;
        continue;
      }
      for (var pi = 0; pi < stus[w3].length; pi++) {
        var pt = stus[w3][pi];
        var dn = 0;
        for (var sti = 0; sti < pt.p.stages.length; sti++) if (pt.p.stages[sti].done) dn++;
        var ppp = Math.round(dn / pt.p.stages.length * 100);
        h += '<div class="classrow"><span class="cwho">👤 ' + esc(w3) + '</span>' +
             '<span class="cname">' + esc(pt.p.name) + '</span>' +
             '<span class="ctag">' + esc(pt.p.theme) + '</span>' +
             '<span class="ctag">' + ppp + '%</span>' +
             '<span class="ctag">' + (pt.p.mentor ? '✅已点评' : '⬜未点评') + '</span>' +
             '<button class="btn-p" onclick="teacherOpen(\'' + w3 + '\',' + pt.p.id + ')">查看 / 点评</button></div>';
        anyStu = true;
      }
    }
  }
  if (!anyStu) h += '<p style="color:var(--muted);font-size:13px;">还没有学生注册或创建项目。</p>';

  h += '<h3 style="margin-top:14px;">📥 未分配学生（' + g.free.length + '）</h3>';
  if (!g.free.length) {
    h += '<p style="color:var(--muted);font-size:13px;">没有未分配学生，大家的账号都有老师了。</p>';
  } else {
    for (var fi = 0; fi < g.free.length; fi++) {
      h += '<div class="classrow"><span class="cwho">👤 ' + esc(g.free[fi].who) + '</span>' +
           '<span class="ctag">' + g.free[fi].items.length + ' 个项目</span></div>';
    }
  }

  h += '<div style="margin-top:12px;"><button class="btn-g" onclick="backToWork()">↻ 刷新</button> ' +
       '<span class="tips" style="font-size:12px;color:var(--muted);">管理员能看全部账号（演示版：同一服务器上的数据）。</span></div>';
  h += '</div>';
  box.innerHTML = h;
}

// 老师接收未分配学生
function claimStudent(who) {
  if ((!isTeacher() && !isAdmin()) || !userNames[who]) return;
  userNames[who].teacher = currentUser;
  localStorage.setItem('ct_users', JSON.stringify(userNames));
  var appsC = pendingApps();   // 如果该学生有待审批申请，一并清掉
  if (appsC[who]) { delete appsC[who]; saveApps(appsC); }
  renderUser();
  renderStats();
  renderClassOverview();
  toast('已把 ' + who + ' 收进你的班 ✔');
}

// 老师把学生移出班级（学生回到「未分配」）
function unassignStudent(who) {
  if ((!isTeacher() && !isAdmin()) || !userNames[who]) return;
  if (!confirm('把 ' + who + ' 移出你的班？')) return;
  userNames[who].teacher = '';   // 置空而非删字段：服务器按账号合并，删字段不会跨设备传递
  localStorage.setItem('ct_users', JSON.stringify(userNames));
  renderUser();
  renderStats();
  renderClassOverview();
  toast('已把 ' + who + ' 移出班级');
}

// 复制老师的邀请码
function copyCode() {
  var c = userNames[currentUser] && userNames[currentUser].code;
  if (!c) { toast('先登录老师账号'); return; }
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(c).then(
      function () { toast('邀请码已复制：' + c); },
      function () { toast('请手动记下邀请码：' + c); }
    );
  } else {
    toast('请手动记下邀请码：' + c);
  }
}

// 注销本机全部账号与数据（删掉 ct_users、所有 ct_* 账号数据、游客数据、登录状态）
function wipeAll() {
  var who = currentUser ? '（当前登录：' + currentUser + '）' : '（当前未登录）';
  if (!confirm('⚠️ 此操作将注销本机浏览器里的【全部账号】，并删除所有账号的项目数据，\n无法恢复！\n' + who + '\n\n确定要注销吗？')) return;
  var keys = storeKeys();
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (k.indexOf('ct_') === 0 || k === 'ctProjects') localStorage.removeItem(k);
  }
  sessionStorage.removeItem('ct_login_s');
  userNames = {};
  currentUser = '';
  viewAs = null;
  projects = [];
  currentId = null;
  failTimes = 0;
  lockUntil = 0;
  closeModal();
  applyRoleUI();
  renderUser();
  renderStats();
  renderList();
  renderDetail();
  toast('已注销本机全部账号与数据 ✔');
}

// 老师进入某个学生的项目（可修改，点保存会写回学生数据）
function teacherOpen(who, pid) {
  viewAs = 'ct_' + who;
  projects = JSON.parse(localStorage.getItem(viewAs) || '[]');
  currentId = pid;
  renderStats();
  renderDetail();
  document.getElementById('detail').scrollIntoView({ behavior: 'smooth' });
}

// 从班级总览 / 学生项目回到老师自己的工作台
function backToWork() {
  viewAs = null;
  currentId = null;
  projects = JSON.parse(localStorage.getItem(currentUser ? 'ct_' + currentUser : 'ctProjects') || '[]');
  applyRoleUI();
  renderUser();
  renderStats();
  if (isTeacher() || isAdmin()) {
    if (isAdmin()) renderGlobalOverview(); else renderClassOverview();   // 管理角色没有自己的项目，「工作台」就是总览
    toast(isAdmin() ? '回到全局总览' : '回到班级总览');
  } else {
    renderList();
    renderDetail();
    toast('回到工作台');
  }
}

// 页面打开时先渲染
if (currentUser) applyRoleUI();   // 老师/管理员刷新页面后不显示学生列表
renderUser();
renderStats();
renderList();
</script>
</body>
</html>
