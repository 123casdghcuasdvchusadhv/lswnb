<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星迹——青少年科创项目协作与同伴互评平台</title>
<style>
  :root {
    --bg:#eef2fb;
    --card:#ffffff;
    --primary:#3b5bdb;
    --primary2:#7048e8;
    --green:#37b24d;
    --text:#1c2333;
    --muted:#7a8699;
    --line:#e6ebf5;
    --shadow:0 2px 8px rgba(30,50,100,.08);
  }
  * { box-sizing:border-box; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg); margin:0; padding:20px; color:var(--text); line-height:1.6;
  }
  .wrap { max-width:960px; margin:0 auto; }

  /* ---------- 顶部 ---------- */
  .hero {
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff; border-radius:16px; padding:28px 24px;
    box-shadow:0 8px 24px rgba(59,91,219,.35); position:relative; overflow:hidden;
  }
  .hero h1 { margin:0; font-size:26px; }
  .hero p { margin:6px 0 0; opacity:.85; font-size:14px; }
  .stats { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; }
  .stat {
    background:rgba(255,255,255,.15); border-radius:12px; padding:10px 16px; min-width:110px;
    backdrop-filter:blur(4px);
  }
  .stat b { font-size:22px; display:block; }
  .stat span { font-size:12px; opacity:.85; }

  /* ---------- 卡片 ---------- */
  .card, .box {
    background:var(--card); border-radius:14px; padding:16px;
    box-shadow:var(--shadow); margin:14px 0; border:1px solid var(--line);
  }
  h3 { margin:0 0 10px; font-size:16px; display:flex; align-items:center; gap:8px; }
  h3::before { content:""; width:4px; height:16px; border-radius:2px; background:linear-gradient(var(--primary),var(--primary2)); }

  input, select, textarea, button { font-size:14px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,91,219,.12); }
  textarea { width:100%; min-height:64px; resize:vertical; }
  button { cursor:pointer; border:none; font-weight:600; transition:.2s; }
  button:hover { transform:translateY(-1px); }
  .btn-p { background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff; }
  .btn-p:hover { box-shadow:0 4px 12px rgba(59,91,219,.35); }
  .btn-g { background:#f0f3fa; color:var(--text); }
  .btn-g:hover { background:#e4e9f5; }
  .btn-danger { background:#fff0f0; color:#e03131; }
  .btn-danger:hover { background:#ffe3e3; }
  .tag {
    background:#eef3ff; color:var(--primary); border-radius:20px; padding:3px 12px; font-size:12px;
    display:inline-block;
  }

  /* ---------- 顶部工具栏 ---------- */
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .toolbar input[type=text] { flex:1; min-width:160px; }
  select { background:#fff; }

  /* ---------- 项目卡片列表 ---------- */
  #list { display:grid; grid-template-columns:1fr; gap:12px; }
  .proj {
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;
    box-shadow:var(--shadow); transition:.2s; cursor:pointer;
  }
  .proj:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(30,50,100,.12); }
  .proj .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
  .proj .name { font-size:17px; font-weight:700; }
  .proj .meta { font-size:12px; color:var(--muted); margin:4px 0 8px; }
  .pbar { background:#ecf0f9; border-radius:8px; height:10px; overflow:hidden; }
  .pfill {
    height:100%; border-radius:8px;
    background:linear-gradient(90deg,var(--primary),var(--primary2));
    transition:width .5s ease; display:block;
  }
  .proj .pct { font-size:12px; color:var(--muted); margin-top:4px; }
  .empty {
    text-align:center; color:var(--muted); padding:36px 0; font-size:14px;
    background:var(--card); border-radius:14px; border:1px dashed var(--line);
  }

  /* ---------- 详情 ---------- */
  #detail .box { animation:fadeIn .3s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .stage {
    display:flex; align-items:center; gap:8px; padding:8px 12px; margin:4px 0;
    background:#f4f7fd; border-radius:10px; cursor:pointer; transition:.2s;
  }
  .stage:hover { background:#eaf0fc; }
  .stage.done { background:#e9f9ed; color:#2b8a3e; }
  .stage.done .sname { text-decoration:line-through; }
  .sno {
    background:var(--primary); color:#fff; border-radius:50%; width:20px; height:20px;
    font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .stage.done .sno { background:var(--green); }

  /* 记录时间线 */
  .timeline { border-left:2px solid var(--line); margin-left:8px; padding-left:16px; }
  .rec { position:relative; margin:10px 0; }
  .rec::before {
    content:""; position:absolute; left:-23px; top:8px; width:10px; height:10px;
    border-radius:50%; background:var(--primary2); border:2px solid #fff;
    box-shadow:0 0 0 2px var(--primary2);
  }
  .rec .time { font-size:12px; color:var(--muted); }
  .rec .txt { background:#f7f9fd; border-radius:10px; padding:8px 10px; margin-top:4px; }
  .rec img { max-width:180px; display:block; margin-top:8px; border-radius:10px; }
  .rec .del { float:right; font-size:12px; padding:2px 8px; }

  /* 互评 */
  .rev {
    display:flex; align-items:center; gap:10px; background:#f7f9fd; border-radius:10px;
    padding:8px 10px; margin:6px 0;
  }
  .rev .stars { color:#fab005; letter-spacing:2px; }
  .rev .from { font-weight:700; font-size:13px; }
  .rev .cmt { color:var(--muted); font-size:13px; flex:1; }
  .avg { font-size:13px; color:var(--muted); }

  /* 能力雷达 */
  .ab {
    display:inline-flex; flex-direction:column; align-items:center; gap:2px;
    margin:6px 12px 6px 0; background:#f4f7fd; border-radius:10px; padding:8px 12px;
  }
  .ab .abName { font-size:13px; font-weight:700; color:var(--primary); }
  .ab input[type=range] { accent-color:var(--primary); }
  .ab b { font-size:16px; }

  /* 弹窗 */
  .mask {
    position:fixed; inset:0; background:rgba(20,30,60,.45); display:none;
    align-items:center; justify-content:center; z-index:99; backdrop-filter:blur(2px);
  }
  .mask.show { display:flex; }
  .modal {
    background:#fff; border-radius:16px; padding:22px; width:90%; max-width:400px;
    box-shadow:0 16px 40px rgba(20,30,60,.3); animation:pop .25s ease;
  }
  @keyframes pop { from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;} }
  .modal h4 { margin:0 0 12px; }
  .modal .tips { font-size:12px; color:var(--muted); margin-top:6px; }
  .modal input[type=text], .modal input[type=password] { width:92%; display:block; margin:6px 0; }
  .modal .tips a { color:var(--primary); text-decoration:none; }

  /* 右上角用户区 */
  .ubox { position:absolute; top:16px; right:20px; display:flex; gap:8px; align-items:center; }
  .ubox button {
    background:rgba(255,255,255,.18); color:#fff; padding:6px 14px;
    border:1px solid rgba(255,255,255,.45); border-radius:20px; font-size:13px;
  }
  .ubox button:hover { background:rgba(255,255,255,.35); transform:none; }
  .ubox .uname { font-size:13px; color:#fff; opacity:.95; }

  /* 提示条 */
  #toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(80px);
    background:#1c2333; color:#fff; padding:10px 20px; border-radius:30px; font-size:14px;
    opacity:0; transition:.3s; z-index:99; box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部 -->
  <div class="hero">
    <h1>🚀 星迹</h1>
    <p>让每一次尝试都被看见 —— 青少年科创项目协作与同伴互评平台</p>
    <div class="stats" id="stats"></div>
    <div class="ubox" id="userbox"></div>
  </div>

  <!-- 新建项目 -->
  <div class="box">
    <h3>新建项目</h3>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      <input id="pname" placeholder="项目名字，比如：自动浇花装置">
      <select id="ptheme">
        <option>未来工厂</option>
        <option>智慧城市</option>
        <option>生命盒子</option>
        <option>自然公社</option>
        <option>太空码头</option>
      </select>
      <input id="pmembers" placeholder="小组成员，用逗号隔开">
      <button class="btn-p" onclick="addProject()">＋ 创建项目</button>
    </div>
  </div>

  <!-- 工具栏：搜索 / 筛选 / 排序 -->
  <div class="toolbar">
    <input type="text" id="kw" placeholder="🔍 搜索项目名称或成员" oninput="renderList()">
    <select id="themeFilter" onchange="renderList()">
      <option value="全部">全部主题</option>
      <option>未来工厂</option>
      <option>智慧城市</option>
      <option>生命盒子</option>
      <option>自然公社</option>
      <option>太空码头</option>
    </select>
    <select id="sortBy" onchange="renderList()">
      <option value="progress">按进度排序</option>
      <option value="new">按新建时间排序</option>
      <option value="name">按名称排序</option>
    </select>
  </div>

  <!-- 项目列表 -->
  <div id="list"></div>

  <!-- 项目详情 -->
  <div id="detail"></div>
</div>

<!-- 通用弹窗（登录 / 注册 / 删除确认） -->
<div class="mask" id="mask" onclick="maskClick(event)">
  <div class="modal">
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ---------- 数据 ----------
var currentUser = localStorage.getItem('ct_login') || '';
var projects = JSON.parse(localStorage.getItem(currentUser ? 'ct_' + currentUser : 'ctProjects') || '[]');
var currentId = null;
var delTargetId = null;

var THEMES = ['未来工厂','智慧城市','生命盒子','自然公社','太空码头'];
var STAGES = ['提出问题','设计方案','记录数据','分析结论','成果展示'];
var STAGE_NOTES = [
  '在这里写下你的问题，比如：怎么让花盆自动浇水？',
  '你的方案是什么？比如：用传感器和定时器实现自动浇水',
  '记下你观察到的数据，比如：第3天叶片全部舒展',
  '得出什么结论？比如：定时浇水比手工浇水更省水',
  '成果打算怎么展示？比如：做个模型并录制讲解视频'
];
var ABILITIES = ['探究','协作','创新','表达'];

function save() {
  localStorage.setItem(currentUser ? 'ct_' + currentUser : 'ctProjects', JSON.stringify(projects));
}

// ---------- 账户（注册 / 登录 / 退出） ----------
var userNames = JSON.parse(localStorage.getItem('ct_users') || '{}');

// 密码做一次简单的不可逆处理（演示用；正式上线要换成专业加密方式）
function hashPass(txt) {
  var h = 7;
  for (var i = 0; i < txt.length; i++) {
    h = ((h << 5) - h + txt.charCodeAt(i)) | 0;
  }
  return String(h);
}

function renderUser() {
  var box = document.getElementById('userbox');
  if (currentUser) {
    box.innerHTML = '<span class="uname">👤 ' + esc(currentUser) + '</span>' +
                    '<button onclick="doLogout()">退出</button>';
  } else {
    box.innerHTML = '<button onclick="openAccount(\'login\')">登录</button>' +
                    '<button onclick="openAccount(\'reg\')">注册</button>';
  }
}

function openAccount(mode) {
  var b = document.getElementById('modalBody');
  if (mode === 'login') {
    b.innerHTML = '<h4>🔑 登录</h4>' +
      '<input id="acUser" type="text" placeholder="用户名">' +
      '<input id="acPass" type="password" placeholder="密码">' +
      '<div style="margin-top:12px; text-align:right;">' +
      '<button class="btn-g" onclick="closeModal()">取消</button> ' +
      '<button class="btn-p" onclick="doLogin()">登录</button></div>' +
      '<p class="tips">还没有账号？<a href="javascript:void(0)" onclick="openAccount(\'reg\')">去注册</a></p>';
  } else {
    b.innerHTML = '<h4>✨ 注册</h4>' +
      '<input id="acUser" type="text" placeholder="用户名（至少2个字符）">' +
      '<input id="acPass" type="password" placeholder="密码（至少4位）">' +
      '<input id="acPass2" type="password" placeholder="再输一次密码">' +
      '<div style="margin-top:12px; text-align:right;">' +
      '<button class="btn-g" onclick="closeModal()">取消</button> ' +
      '<button class="btn-p" onclick="doReg()">注册</button></div>';
  }
  document.getElementById('mask').className = 'mask show';
}

function doLogin() {
  var u = document.getElementById('acUser').value.trim();
  var p = document.getElementById('acPass').value;
  if (!u || !p) { toast('请填写用户名和密码'); return; }
  if (!userNames[u] || userNames[u].hash !== hashPass(p)) { toast('用户名或密码不对'); return; }
  applyAccount(u);
  closeModal();
  toast('欢迎回来，' + u + ' ✔');
}

function doReg() {
  var u = document.getElementById('acUser').value.trim();
  var p = document.getElementById('acPass').value;
  var p2 = document.getElementById('acPass2').value;
  if (u.length < 2) { toast('用户名至少 2 个字符'); return; }
  if (p.length < 4) { toast('密码至少 4 位'); return; }
  if (p !== p2) { toast('两次密码不一致'); return; }
  if (userNames[u]) { toast('这个用户名已被注册'); return; }
  if (u === 'users' || u === 'login') { toast('这个名字不能用'); return; }
  userNames[u] = { hash: hashPass(p), created: Date.now() };
  localStorage.setItem('ct_users', JSON.stringify(userNames));
  applyAccount(u);
  closeModal();
  toast('注册成功 ✔');
}

function doLogout() {
  localStorage.removeItem('ct_login');
  currentUser = '';
  projects = JSON.parse(localStorage.getItem('ctProjects') || '[]');
  currentId = null;
  renderUser();
  renderStats();
  renderList();
  renderDetail();
  toast('已退出登录');
}

function applyAccount(u) {
  currentUser = u;
  localStorage.setItem('ct_login', u);
  projects = JSON.parse(localStorage.getItem('ct_' + u) || '[]');
  currentId = null;
  save();
  renderUser();
  renderStats();
  renderList();
  renderDetail();
}

function findProject(id) {
  for (var i = 0; i < projects.length; i++) {
    if (projects[i].id === id) return projects[i];
  }
  return null;
}

function esc(s) {
  return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escAttr(s) {
  return esc(s).replace(/"/g,'&quot;');
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = ''; }, 2200);
}

// ---------- 画能力雷达图（SVG，不用装插件） ----------
function radarSVG(values, size) {
  var cx = size / 2, cy = size / 2, r = size / 2 - 34;
  var n = values.length;
  var s = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';

  for (var level = 2; level <= 10; level += 2) {
    var pts = [];
    for (var i = 0; i < n; i++) {
      var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
      var rr = r * level / 10;
      pts.push((cx + rr * Math.cos(ang)).toFixed(1) + ',' + (cy + rr * Math.sin(ang)).toFixed(1));
    }
    s += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#e0e7f5"/>';
  }
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + r * Math.cos(ang)).toFixed(1) +
         '" y2="' + (cy + r * Math.sin(ang)).toFixed(1) + '" stroke="#e0e7f5"/>';
  }
  var dpts = [];
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    var v = Math.max(0, Math.min(10, Number(values[i]) || 0));
    var rr = r * v / 10;
    dpts.push((cx + rr * Math.cos(ang)).toFixed(1) + ',' + (cy + rr * Math.sin(ang)).toFixed(1));
  }
  // 渐变填充的封闭图形
  s += '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">';
  s += '<stop offset="0%" stop-color="#3b5bdb" stop-opacity="0.45"/>';
  s += '<stop offset="100%" stop-color="#7048e8" stop-opacity="0.25"/>';
  s += '</linearGradient></defs>';
  s += '<polygon points="' + dpts.join(' ') + '" fill="url(#rg)" stroke="#4263eb" stroke-width="2"/>';

  // 顶点圆点 + 分数
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    var v = Math.max(0, Math.min(10, Number(values[i]) || 0));
    var rr = r * v / 10;
    var px = cx + rr * Math.cos(ang), py = cy + rr * Math.sin(ang);
    s += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="4" fill="#fff" stroke="#4263eb" stroke-width="2"/>';
    var lx = cx + (r + 20) * Math.cos(ang);
    var ly = cy + (r + 20) * Math.sin(ang);
    s += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) +
         '" font-size="12" font-weight="700" fill="#333" text-anchor="middle" dominant-baseline="middle">'
         + ABILITIES[i] + ' ' + v + '</text>';
  }
  s += '</svg>';
  return s;
}

// ---------- 顶部统计 ----------
function renderStats() {
  var recs = 0, scores = [], done = 0, total = 0;
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    recs += p.records.length;
    for (var k = 0; k < p.reviews.length; k++) scores.push(p.reviews[k].score);
    for (var j = 0; j < p.stages.length; j++) { if (p.stages[j].done) done++; total++; }
  }
  var avg = scores.length ? (scores.reduce(function(a,b){ return a + b; }, 0) / scores.length).toFixed(1) : '—';
  var pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('stats').innerHTML =
    '<div class="stat"><b>' + projects.length + '</b><span>项目总数</span></div>' +
    '<div class="stat"><b>' + recs + '</b><span>记录总数</span></div>' +
    '<div class="stat"><b>★ ' + avg + '</b><span>互评平均分</span></div>' +
    '<div class="stat"><b>' + pct + '%</b><span>整体进度</span></div>';
}

// ---------- 新建项目 ----------
function addProject() {
  var name = document.getElementById('pname').value.trim();
  var theme = document.getElementById('ptheme').value;
  var members = document.getElementById('pmembers').value.trim();
  if (!name) { toast('请先写项目名字'); return; }

  var stageList = [];
  for (var i = 0; i < STAGES.length; i++) {
    stageList.push({ name: STAGES[i], done: false, note: '' });
  }

  projects.push({
    id: Date.now(),
    name: name,
    theme: theme,
    members: members ? members.split(/[,，、\s]+/) : [],
    stages: stageList,
    records: [],
    reviews: [],
    mentor: '',
    ability: [4, 4, 4, 4]
  });

  document.getElementById('pname').value = '';
  document.getElementById('pmembers').value = '';
  save();
  renderStats();
  renderList();
  toast('项目已创建 ✔');
}

function doneCount(p) {
  var n = 0;
  for (var i = 0; i < p.stages.length; i++) if (p.stages[i].done) n++;
  return n;
}

// ---------- 项目列表（搜索 + 筛选 + 排序） ----------
function renderList() {
  var kw = document.getElementById('kw').value.trim().toLowerCase();
  var theme = document.getElementById('themeFilter').value;
  var sortBy = document.getElementById('sortBy').value;
  var list = document.getElementById('list');

  var shown = [];
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    var okTheme = theme === '全部' || p.theme === theme;
    var hay = (p.name + ' ' + p.members.join(' ')).toLowerCase();
    var okKw = !kw || hay.indexOf(kw) >= 0;
    if (okTheme && okKw) shown.push(p);
  }

  if (sortBy === 'progress') {
    shown.sort(function(a, b) { return doneCount(b) - doneCount(a); });
  } else if (sortBy === 'new') {
    shown.sort(function(a, b) { return b.id - a.id; });
  } else {
    shown.sort(function(a, b) { return a.name.localeCompare(b.name, 'zh'); });
  }

  if (shown.length === 0) {
    list.innerHTML = '<div class="empty">📭 没有符合的项目，试试别的关键词，或者新建一个吧</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < shown.length; i++) {
    var p = shown[i];
    var d = doneCount(p);
    var pct = Math.round(d / p.stages.length * 100);
    html += '<div class="proj" onclick="openProject(' + p.id + ')">' +
      '<div class="top"><span class="name">' + esc(p.name) + '</span>' +
      '<span class="tag">' + esc(p.theme) + '</span></div>' +
      '<div class="meta">👥 ' + (p.members.length ? esc(p.members.join('、')) : '（未填写成员）') +
      '　📅 ' + new Date(p.id).toLocaleDateString() + '</div>' +
      '<div class="pbar"><span class="pfill" style="width:' + pct + '%"></span></div>' +
      '<div class="pct">进度 ' + d + '/' + p.stages.length + '（' + pct + '%）' +
      '　📝 记录 ' + p.records.length + '　⭐ 互评 ' + p.reviews.length + '</div>' +
      '</div>';
  }
  list.innerHTML = html;
}

// ---------- 打开 / 关闭详情 ----------
function openProject(id) {
  currentId = id;
  renderDetail();
  document.getElementById('detail').scrollIntoView({ behavior: 'smooth' });
}

function closeDetail() {
  currentId = null;
  renderDetail();
}

function askDelete(id) {
  var p = findProject(id);
  delTargetId = id;
  document.getElementById('modalBody').innerHTML =
    '<h4>😢 确定删除这个项目吗？</h4>' +
    '<p style="font-size:13px;color:var(--muted);">「' + esc(p.name) + '」删除后无法恢复，确定吗？</p>' +
    '<div style="text-align:right; margin-top:14px;">' +
    '<button class="btn-g" onclick="closeModal()">再想想</button> ' +
    '<button class="btn-danger" onclick="confirmDel()" style="margin-left:8px;">删除</button></div>';
  document.getElementById('mask').className = 'mask show';
}

function confirmDel() {
  if (!delTargetId) return;
  var newList = [];
  for (var i = 0; i < projects.length; i++) {
    if (projects[i].id !== delTargetId) newList.push(projects[i]);
  }
  projects = newList;
  if (currentId === delTargetId) currentId = null;
  save();
  closeModal();
  renderStats();
  renderList();
  renderDetail();
  toast('已删除');
}

function closeModal() {
  delTargetId = null;
  document.getElementById('mask').className = 'mask';
}

function maskClick(e) {
  if (e.target === document.getElementById('mask')) closeModal();
}

// ---------- 编辑项目资料 ----------
function editProject(id) {
  var p = findProject(id);
  var name = prompt('项目名称', p.name);
  if (name === null) return;
  name = name.trim();
  if (!name) { toast('名称不能为空'); return; }
  var theme = prompt('主题（未来工厂 / 智慧城市 / 生命盒子 / 自然公社 / 太空码头）', p.theme);
  if (theme === null) return;
  theme = theme.trim();
  if (THEMES.indexOf(theme) < 0) { toast('主题不在可选范围内'); return; }
  var m = prompt('成员（逗号隔开）', p.members.join('、'));
  if (m === null) return;
  p.name = name;
  p.theme = theme;
  p.members = m.trim() ? m.trim().split(/[,，、\s]+/) : [];
  save();
  renderStats();
  renderList();
  renderDetail();
  toast('已保存修改 ✔');
}

// ---------- 项目详情 ----------
function renderDetail() {
  var box = document.getElementById('detail');
  var p = findProject(currentId);
  if (!p) { box.innerHTML = ''; return; }

  var d = doneCount(p);
  var pct = Math.round(d / p.stages.length * 100);
  var avg = 0;
  for (var i = 0; i < p.reviews.length; i++) avg += p.reviews[i].score;
  if (p.reviews.length) avg = (avg / p.reviews.length).toFixed(1);

  var html = '<div class="box">';
  html += '<div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">';
  html += '<div><h2 style="margin:0; color:var(--primary);">' + esc(p.name) + '</h2>' +
          '<p style="margin:6px 0 0; font-size:13px; color:var(--muted);">主题：' + esc(p.theme) +
          '　👥 成员：' + (p.members.length ? esc(p.members.join('、')) : '（未填写）') + '</p></div>';
  html += '<div><button class="btn-g" onclick="editProject(' + p.id + ')">✏️ 编辑资料</button> ' +
          '<button class="btn-danger" onclick="askDelete(' + p.id + ')">删除</button></div>';
  html += '</div>';

  html += '<div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">' +
          '<span class="tag">进度 ' + pct + '%</span><span class="tag">记录 ' + p.records.length + ' 条</span>' +
          '<span class="tag">互评 ★ ' + (p.reviews.length ? avg : '—') + '</span></div>';

  // 1. 项目阶段流程
  html += '<h3>项目进度</h3>';
  html += '<div class="pbar" style="margin-bottom:10px;"><span class="pfill" style="width:' + pct + '%"></span></div>';
  for (var i = 0; i < p.stages.length; i++) {
    var s = p.stages[i];
    html += '<label class="stage ' + (s.done ? 'done' : '') + '">' +
            '<input type="checkbox" ' + (s.done ? 'checked' : '') +
            ' onchange="toggleStage(' + p.id + ',' + i + ')"> ' +
            '<span class="sno">' + (i + 1) + '</span> <span class="sname">' + s.name + '</span></label>';
    html += '<div style="margin:0 0 8px 34px;">' +
            '<input id="q' + p.id + '_' + i + '" style="width:92%; max-width:520px;" placeholder="' +
            STAGE_NOTES[i] + '" value="' + escAttr(s.note || '') +
            '" onchange="saveStageNote(' + p.id + ',' + i + ', this.value)"></div>';
  }

  // 2. 过程记录（时间线）
  html += '<h3>过程记录</h3>';
  html += '<textarea id="recText" placeholder="写点什么，比如今天做了什么、发现了什么"></textarea>';
  html += '<div style="margin-top:6px;"><input type="file" id="recFile" accept="image/*"> ';
  html += '<button class="btn-p" onclick="addRecord(' + p.id + ')">＋ 添加记录</button></div>';
  if (p.records.length === 0) {
    html += '<p style="color:var(--muted); font-size:13px;">（还没有记录，动手写下第一条吧）</p>';
  } else {
    html += '<div class="timeline">';
    for (var k = p.records.length - 1; k >= 0; k--) {
      var r = p.records[k];
      html += '<div class="rec"><span class="time">' + r.time + '</span>' +
              '<button class="btn-g del" onclick="delRecord(' + p.id + ',' + k + ')">✕</button>' +
              (r.text ? '<div class="txt">' + esc(r.text) + '</div>' : '') +
              (r.img ? '<img src="' + r.img + '">' : '') + '</div>';
    }
    html += '</div>';
  }

  // 3. 同伴互评
  html += '<h3>同伴互评</h3><div class="avg">';
  html += p.reviews.length ? '共 ' + p.reviews.length + ' 条，平均 ★ ' + avg : '还没有互评，来写下第一条吧';
  html += '</div>';
  html += '<div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:4px;"><input id="revFrom" placeholder="你的名字">';
  html += '<select id="revScore">';
  for (var n = 1; n <= 5; n++) html += '<option value="' + n + '">' + n + ' ★</option>';
  html += '</select>';
  html += '<input id="revComment" placeholder="写一句评语" style="flex:1; min-width:140px;">';
  html += '<button class="btn-p" onclick="addReview(' + p.id + ')">提交互评</button></div>';
  for (var m = 0; m < p.reviews.length; m++) {
    var rv = p.reviews[m];
    html += '<div class="rev"><span class="from">' + esc(rv.from || '匿名') + '</span>' +
            '<span class="stars">' + '★'.repeat(rv.score || 1) + '</span>' +
            '<span class="cmt">' + esc(rv.comment) + '</span>' +
            '<button class="btn-g del" onclick="delReview(' + p.id + ',' + m + ')">✕</button></div>';
  }

  // 4. 导师点评
  html += '<h3>导师点评</h3>';
  html += '<textarea id="mentorText" placeholder="老师的点评">' + esc(p.mentor || '') + '</textarea><br>';
  html += '<button class="btn-p" onclick="saveMentor(' + p.id + ')">保存点评</button>';

  // 5. 能力雷达（滑杆调节）
  html += '<h3>能力雷达</h3>';
  html += '<div style="text-align:center;">' + radarSVG(p.ability, 260) + '</div>';
  html += '<div style="display:flex; flex-wrap:wrap; justify-content:center; margin-top:4px;">';
  for (var a = 0; a < ABILITIES.length; a++) {
    html += '<span class="ab"><span class="abName">' + ABILITIES[a] + '</span>' +
            '<input id="ab' + a + '" type="range" min="0" max="10" step="1" value="' + p.ability[a] + '"' +
            ' oninput="setAbilityVal(this.value,' + a + ')">' +
            '<b id="abv' + a + '">' + p.ability[a] + '</b></span>';
  }
  html += '</div>';
  html += '<div style="text-align:center;">' +
          '<button class="btn-p" onclick="saveAbility(' + p.id + ')">保存分数</button> ' +
          '<button class="btn-g" onclick="autoAbility(' + p.id + ')">按进度自动填</button></div>';

  // 6. 档案与输出
  html += '<h3>项目档案</h3>';
  html += '<button class="btn-p" onclick="exportHTML(' + p.id + ')">📄 生成精美档案</button> ';
  html += '<button class="btn-g" onclick="exportTxt(' + p.id + ')">导出 TXT</button> ';
  html += '<button class="btn-g" onclick="openParent(' + p.id + ')">👨‍👩‍👧 家长查看页</button> ';
  html += '<button class="btn-g" onclick="closeDetail()">关闭</button>';

  html += '</div>';
  box.innerHTML = html;
}

function setAbilityVal(v, a) {
  document.getElementById('abv' + a).textContent = v;
}

// ---------- 各操作 ----------
function toggleStage(id, index) {
  var p = findProject(id);
  p.stages[index].done = !p.stages[index].done;
  save();
  renderStats();
  renderList();
  renderDetail();
}

// 保存每一步里填写的具体内容（提出问题这一步填的就是问题）
function saveStageNote(id, index, text) {
  var p = findProject(id);
  p.stages[index].note = text.trim();
  save();
  toast('已保存 ✔');
}

function addRecord(id) {
  var p = findProject(id);
  var text = document.getElementById('recText').value.trim();
  var file = document.getElementById('recFile').files[0];
  if (!text && !file) { toast('写点内容或选张图片吧'); return; }

  var now = new Date().toLocaleString();
  if (file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      p.records.push({ time: now, text: text, img: e.target.result });
      save();
      renderStats();
      renderList();
      renderDetail();
      toast('记录已添加 ✔');
    };
    reader.readAsDataURL(file);
  } else {
    p.records.push({ time: now, text: text, img: '' });
    save();
    renderStats();
    renderList();
    renderDetail();
    toast('记录已添加 ✔');
  }
}

function delRecord(id, index) {
  var p = findProject(id);
  p.records.splice(index, 1);
  save();
  renderStats();
  renderList();
  renderDetail();
  toast('记录已删除');
}

function addReview(id) {
  var p = findProject(id);
  var from = document.getElementById('revFrom').value.trim();
  var score = Number(document.getElementById('revScore').value);
  var comment = document.getElementById('revComment').value.trim();
  if (!comment) { toast('写一句评语再提交吧'); return; }
  p.reviews.push({ from: from, score: score, comment: comment });
  document.getElementById('revComment').value = '';
  save();
  renderStats();
  renderList();
  renderDetail();
  toast('互评已提交 ✔');
}

function delReview(id, index) {
  var p = findProject(id);
  p.reviews.splice(index, 1);
  save();
  renderStats();
  renderList();
  renderDetail();
}

function saveMentor(id) {
  var p = findProject(id);
  var t = document.getElementById('mentorText').value.trim();
  p.mentor = t;
  save();
  if (t) toast('点评已保存 ✔');
  else toast('点评已清空');
}

function saveAbility(id) {
  var p = findProject(id);
  for (var a = 0; a < ABILITIES.length; a++) {
    p.ability[a] = Number(document.getElementById('ab' + a).value) || 0;
  }
  save();
  renderDetail();
  toast('能力分数已保存 ✔');
}

function autoAbility(id) {
  var p = findProject(id);
  var d = doneCount(p), withImg = 0;
  for (var k = 0; k < p.records.length; k++) if (p.records[k].img) withImg++;

  p.ability[0] = Math.min(10, Math.round(d / p.stages.length * 6) + Math.min(p.records.length, 4));
  p.ability[1] = Math.min(10, p.reviews.length + p.members.length);
  p.ability[2] = Math.min(10, 2 + withImg);
  p.ability[3] = p.stages[p.stages.length - 1].done ? 8 : 4;

  save();
  renderDetail();
  toast('已按进度自动填分，可以再手动微调');
}

// ---------- 导出 TXT ----------
function exportTxt(id) {
  var p = findProject(id);
  var t = '【科创项目档案】\n';
  t += '项目名称：' + p.name + '\n';
  t += '主题：' + p.theme + '\n';
  t += '成员：' + (p.members.join('、') || '（未填写）') + '\n\n';

  t += '【阶段进度】\n';
  for (var i = 0; i < p.stages.length; i++) {
    t += (i + 1) + '. ' + p.stages[i].name + (p.stages[i].done ? ' 已完成' : ' 未完成');
    if (p.stages[i].note) t += (i === 0 ? '（问题：' : '（内容：') + p.stages[i].note + '）';
    t += '\n';
  }

  t += '\n【能力评分】\n';
  for (var a = 0; a < ABILITIES.length; a++) {
    t += ABILITIES[a] + '：' + p.ability[a] + '/10\n';
  }

  t += '\n【过程记录】\n';
  for (var k = 0; k < p.records.length; k++) {
    t += (k + 1) + '. [' + p.records[k].time + '] ' + p.records[k].text +
         (p.records[k].img ? '（含图片）' : '') + '\n';
  }

  t += '\n【同伴互评】\n';
  for (var m = 0; m < p.reviews.length; m++) {
    t += (p.reviews[m].from || '匿名') + '：' + '★'.repeat(p.reviews[m].score || 1) +
         ' ' + p.reviews[m].comment + '\n';
  }

  t += '\n【导师点评】\n' + (p.mentor || '（暂无）') + '\n';

  var blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
  var a2 = document.createElement('a');
  a2.href = URL.createObjectURL(blob);
  a2.download = p.name + '_项目档案.txt';
  a2.click();
}

// 页面打开时先渲染
renderUser();
renderStats();
renderList();
</script>
</body>
</html>
